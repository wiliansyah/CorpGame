                down: [{ num: 1, idx: 0, clue: "Manilla folder" }, { num: 2, idx: 1, clue: "De-wrinkle a shirt" }, { num: 3, idx: 2, clue: "Amount of work" }, { num: 4, idx: 3, clue: "Wraps up the meeting" }],
                trivia: "Digital file management saves the average employee roughly 2 hours a week compared to paper filing."
            }
        ];

        const WORDFLOWER_BANK = [
            { pangram: "COMPANY", center: "P", letters: ["C", "O", "M", "A", "N", "Y", "P"], validWords: ["COMPANY", "CAMP", "COMP", "PONY", "COPY", "CANOPY", "CAPO", "COOP", "POMP"], trivia: "The word 'Company' comes from Latin 'com' (together) and 'panis' (bread) — literally, people who break bread together." },
            { pangram: "PROBLEM", center: "O", letters: ["P", "R", "B", "L", "E", "M", "O"], validWords: ["PROBLEM", "PROBE", "MORE", "ROLE", "POLE", "BOOM", "MOPE", "ROPE", "BORE", "LOBE", "ROOM", "MOOR", "POOL", "LOOP", "POEM"], trivia: "Employees spend an average of 2.8 hours a week dealing with workplace problems and conflicts." },
            { pangram: "NETWORK", center: "O", letters: ["N", "E", "T", "W", "R", "K", "O"], validWords: ["NETWORK", "WORK", "WOKE", "TORE", "TONE", "ROOT", "NOTE", "ROTE", "TORN", "KNOT", "WORN", "TOWN", "KNOW"], trivia: "85% of all open positions are filled through networking, not traditional job boards." },
            { pangram: "BUDGETS", center: "U", letters: ["B", "D", "G", "E", "T", "S", "U"], validWords: ["BUDGETS", "BUDGET", "GUEST", "BUGS", "TUBE", "DUST", "STUB", "STUD", "SUED", "SUET", "TUBS", "GUTS"], trivia: "Corporate budget planning originally started in the 1920s as a tool for managing industrial manufacturing costs." },
            { pangram: "PROJECT", center: "O", letters: ["P", "R", "J", "E", "C", "T", "O"], validWords: ["PROJECT", "PORT", "PORE", "POET", "CROP", "COPE", "CORE", "ROPE"], trivia: "Project management as a modern discipline began in the 1950s." }
        ];

        // 5 Core Games
        const GAME_TYPES = ['MINI_CROSSWORD', 'WORDFLOWER', 'SYNERGY_SQUARE', 'JARGON_BUSTER', 'PROCESS_FLOW'];

        // Global Generator exposed to window for Admin sandbox
        window.generatePuzzleData = (gameType, seed) => {
            const rng = seededRNG(seed); 
            let puzzleData = {};

            if (gameType === 'JARGON_BUSTER') {
                puzzleData = pickRandom(JARGON_BANK, rng);
            }
            else if (gameType === 'PROCESS_FLOW') {
                const base = pickRandom(PROCESS_BANK, rng);
                const orderedSteps = base.steps.map((text, i) => ({ originalIndex: i, text }));
                const shuffledSteps = shuffleArray(orderedSteps, rng);
                const displaySteps = shuffledSteps.map((step, i) => ({ 
                    id: String.fromCharCode(65 + i), 
                    text: step.text,
                    originalIndex: step.originalIndex 
                }));
                const solution = [...displaySteps].sort((a, b) => a.originalIndex - b.originalIndex).map(s => s.id);

                puzzleData = {
                    title: base.title, desc: base.desc, trivia: base.trivia,
                    steps: displaySteps, 
                    solution: solution
                };
            }
            else if (gameType === 'SYNERGY_SQUARE') {
                const colors = [
                    "bg-[#f9df6d] text-slate-900 border-[#d4bd54]", // Yellow
                    "bg-[#a0c35a] text-white border-[#87a54a]", // Green
                    "bg-[#b0c4ef] text-slate-900 border-[#93a7cf]", // Blue
                    "bg-[#ba81c5] text-white border-[#9c6a9c]"  // Purple
                ];
                const selectedCats = shuffleArray([...SYNERGY_CATEGORIES_ALL], rng).slice(0, 4);
                
                puzzleData = {
                    categories: selectedCats.map((cat, i) => {
                        return { title: cat.title, items: cat.items, bgClass: colors[i] };
                    }),
                    trivia: "Finding synergy across corporate divisions can increase overall efficiency by up to 20%."
                };
            }
            else if (gameType === 'MINI_CROSSWORD') {
                puzzleData = pickRandom(CROSSWORD_BANK, rng);
            }
            else if (gameType === 'WORDFLOWER') {
                puzzleData = pickRandom(WORDFLOWER_BANK, rng);
                const outerLetters = puzzleData.letters.filter(l => l !== puzzleData.center);
                puzzleData.outerLetters = shuffleArray(outerLetters, rng);
            }
            return puzzleData;
        };

        const getAllPuzzlesForDay = (dayIndex) => {
            if (dayIndex < 0) return null;
            const puzzles = {};
            GAME_TYPES.forEach((type, idx) => {
                const rngSeed = dayIndex * 100 + idx; 
                puzzles[type] = window.generatePuzzleData(type, rngSeed);
            });
            return puzzles;
        };

        const getGameMaxAttempts = (gameType) => {
            if (gameType === 'JARGON_BUSTER') return 6;
            if (gameType === 'PROCESS_FLOW') return 4;
            if (gameType === 'SYNERGY_SQUARE') return 4; 
            if (gameType === 'MINI_CROSSWORD') return 10;
            if (gameType === 'WORDFLOWER') return 10; 
            return 5;
        };

        const getDayParams = () => {
            const now = new Date();
            const localDateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const localNow = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const localEpoch = new Date(EPOCH_DATE.getFullYear(), EPOCH_DATE.getMonth(), EPOCH_DATE.getDate());
            
            const diffTime = Math.abs(localNow - localEpoch);
            const dayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            const puzzles = getAllPuzzlesForDay(dayIndex);
            
            const rngSeed = dayIndex + 5000;
            const rng = seededRNG(rngSeed);
            const activeGameTypes = shuffleArray([...GAME_TYPES], rng).slice(0, 3);

            return { 
                dayIndex, 
                activeGameTypes, 
                puzzles, 
                todayStr: localDateStr, 
                isTestMode: false,
                rngSeed
            };
        };

        const evaluateAttempt = (guessArray, targetArray) => {
            let result = Array(targetArray.length).fill('absent');
            let targetCopy = [...targetArray];
            
            // Phase 1: Exact matches
            guessArray.forEach((val, i) => {
                if (val === targetCopy[i] && val !== '') { result[i] = 'correct'; targetCopy[i] = null; }
            });
            // Phase 2: Partial matches
            guessArray.forEach((val, i) => {
                if (result[i] !== 'correct' && targetCopy.includes(val) && val !== '') {
                    result[i] = 'present'; targetCopy[targetCopy.indexOf(val)] = null;
                }
            });
            return result;
        };

        const Toast = ({ message, isVisible, isError }) => (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'} w-[90%] max-w-sm`}>
                <div className={`${isError ? 'bg-rose-900 text-white' : 'bg-slate-900 text-white'} px-4 py-3 rounded-2xl shadow-2xl text-sm font-semibold flex items-start gap-3`}>
                    <Icon name={isError ? "alert-triangle" : "check-circle-2"} className={`w-5 h-5 shrink-0 mt-0.5 ${isError ? 'text-rose-400' : 'text-emerald-400'}`} />
                    <span className="leading-relaxed">{message}</span>
                </div>
            </div>
        );

        const Confetti = () => {
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];
            return (
                <div className="fixed inset-0 pointer-events-none z-[90] overflow-hidden">
                    {[...Array(40)].map((_, i) => (
                        <div key={i} className="absolute w-3 h-3 rounded-sm animate-confetti-fall"
                            style={{ left: `${Math.random() * 100}%`, backgroundColor: colors[i % colors.length], animationDelay: `${Math.random() * 2}s`, animationDuration: `${2 + Math.random() * 2}s` }}
                        />
                    ))}
                </div>
            );
        };

        const WordleGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const targetWord = puzzle.word;
            const wordLen = targetWord.length;
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);

            const onKeyPress = useCallback((key) => {
                if (status !== 'playing') return;
                const safeGuess = typeof currentGuess === 'string' ? currentGuess : '';
                if (key === 'ENTER') {
                    if (safeGuess.length !== wordLen) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                    const evaluation = evaluateAttempt(safeGuess.split(''), targetWord.split(''));
                    const newHistory = [...history, { guess: safeGuess, evaluation }];
                    let newStatus = 'playing';
                    if (safeGuess === targetWord) newStatus = 'won';
                    else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                    setGameState({ history: newHistory, currentGuess: '', status: newStatus });
                    if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
                } else if (key === 'BACKSPACE') { setGameState(prev => ({ ...prev, currentGuess: (typeof prev.currentGuess === 'string' ? prev.currentGuess : '').slice(0, -1) })); } 
                else if (safeGuess.length < wordLen && /^[A-Z]$/.test(key)) { setGameState(prev => ({ ...prev, currentGuess: (typeof prev.currentGuess === 'string' ? prev.currentGuess : '') + key })); }
            }, [currentGuess, history, status, wordLen]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key === 'Enter') onKeyPress('ENTER');
                    else if (e.key === 'Backspace') onKeyPress('BACKSPACE');
                    else { const char = e.key.toUpperCase(); if (/^[A-Z]$/.test(char)) onKeyPress(char); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onKeyPress]);

            const keyColors = {};
            history.forEach((attempt) => {
                attempt.guess.split('').forEach((letter, i) => {
                    const evalState = attempt.evaluation[i];
                    if (evalState === 'correct') keyColors[letter] = 'bg-correct';
                    else if (evalState === 'present' && keyColors[letter] !== 'bg-correct') keyColors[letter] = 'bg-present';
                    else if (evalState === 'absent' && !keyColors[letter]) keyColors[letter] = 'bg-absent';
                });
            });

            const keys = [['Q','W','E','R','T','Y','U','I','O','P'], ['A','S','D','F','G','H','J','K','L'], ['ENTER','Z','X','C','V','B','N','M','BACKSPACE']];
            const safeGuess = typeof currentGuess === 'string' ? currentGuess : '';

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Definition</span>
                        <p className="text-slate-800 font-semibold mt-1 text-sm md:text-base">"{puzzle.clue}"</p>
                    </div>
                    <div className="flex-1 flex flex-col justify-center gap-1.5 mb-6 max-w-sm mx-auto w-full">
                        {[...Array(maxAttempts)].map((_, rIdx) => {
                            const attempt = history[rIdx];
                            const isActive = rIdx === history.length && status === 'playing';
                            const wordTiles = attempt ? attempt.guess.split('') : (isActive ? safeGuess.padEnd(wordLen, ' ').split('') : Array(wordLen).fill(''));
                            return (
                                <div key={rIdx} className={`flex gap-1.5 justify-center ${isActive && isShaking ? 'animate-shake' : ''}`}>
                                    {wordTiles.map((char, cIdx) => {
                                        const state = attempt ? attempt.evaluation[cIdx] : (char !== ' ' && char !== '' ? 'tbd' : 'empty');
                                        return (
                                            <div key={cIdx} className={`w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded text-2xl font-bold border-2 transition-all duration-500 uppercase
                                                ${state === 'empty' ? 'bg-transparent border-slate-200' : ''}
                                                ${state === 'tbd' ? 'bg-transparent border-slate-400 text-slate-800 animate-pop' : ''}
                                                ${state === 'correct' ? 'bg-correct animate-flip' : ''}
                                                ${state === 'present' ? 'bg-present animate-flip' : ''}
                                                ${state === 'absent' ? 'bg-absent animate-flip' : ''}
                                            `} style={{ animationDelay: attempt ? `${cIdx * 0.15}s` : '0s' }}>{char}</div>
                                        )
                                    })}
                                </div>
                            )
                        })}
                    </div>
                    <div className="mt-auto px-1 max-w-lg mx-auto w-full pb-4">
                        {keys.map((row, rIdx) => (
                            <div key={rIdx} className="flex justify-center gap-1 mb-1.5">
                                {row.map(key => {
                                    const isSpecial = key.length > 1;
                                    return (
                                        <button key={key} onClick={() => onKeyPress(key)}
                                            className={`h-12 md:h-14 rounded font-bold text-xs flex items-center justify-center transition-colors shadow-sm
                                            ${isSpecial ? 'px-2 md:px-4 bg-slate-300 text-slate-700' : 'flex-1 max-w-[38px] bg-slate-200 text-slate-800'}
                                            ${keyColors[key] || ''} active:scale-95`}
                                        >
                                            {key === 'BACKSPACE' ? <Icon name="delete" className="w-5 h-5" /> : key === 'ENTER' ? 'ENT' : key}
                                        </button>
                                    )
                                })}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SequenceGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);
            const guessArr = Array.isArray(currentGuess) ? currentGuess : [];
            const stepLen = puzzle.steps.length;

            const handleToggleStep = (stepId) => {
                if (status !== 'playing') return;
                if (guessArr.includes(stepId)) setGameState(prev => ({ ...prev, currentGuess: guessArr.filter(id => id !== stepId) }));
                else if (guessArr.length < stepLen) setGameState(prev => ({ ...prev, currentGuess: [...guessArr, stepId] }));
            };

            const handleSubmit = () => {
                if (guessArr.length !== stepLen) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                const evaluation = evaluateAttempt(guessArr, puzzle.solution);
                const newHistory = [...history, { guess: [...guessArr], evaluation }];
                let newStatus = 'playing';
                if (evaluation.every(e => e === 'correct')) newStatus = 'won';
                else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                setGameState({ history: newHistory, currentGuess: [], status: newStatus });
                if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
            };

            const getStepText = (id) => puzzle.steps.find(s => s.id === id)?.text || '';

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">{puzzle.title}</span>
                        <p className="text-slate-800 font-semibold mt-1 text-sm">{puzzle.desc}</p>
                    </div>
                    <div className="flex flex-col items-center gap-1 mb-4">
                        {history.map((attempt, rIdx) => (
                            <div key={rIdx} className="flex gap-1">
                                {attempt.evaluation.map((ev, cIdx) => (
                                    <div key={cIdx} className={`w-8 h-8 rounded border flex items-center justify-center font-bold text-xs text-white ${ev === 'correct' ? 'bg-correct animate-flip' : ev === 'present' ? 'bg-present animate-flip' : 'bg-absent animate-flip'}`} style={{ animationDelay: `${cIdx * 0.15}s` }}>
                                        {cIdx + 1}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                    {status === 'playing' && (
                        <div className="mt-auto space-y-4 max-w-lg mx-auto w-full">
                            <div className={`flex flex-col gap-2 p-3 bg-slate-100 rounded-xl border border-slate-200 min-h-[180px] ${isShaking ? 'animate-shake' : ''}`}>
                                <p className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Your Sequence</p>
                                {guessArr.map((id, idx) => (
                                    <div key={idx} onClick={() => handleToggleStep(id)} className="p-3 bg-white border border-indigo-300 rounded shadow-sm text-sm font-semibold flex items-center gap-3 cursor-pointer hover:bg-rose-50 transition-colors animate-pop">
                                        <span className="w-6 h-6 rounded bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs shrink-0">{idx + 1}</span>
                                        <span className="flex-1">{getStepText(id)}</span>
                                    </div>
                                ))}
                                {guessArr.length === 0 && <p className="text-slate-400 text-sm text-center py-6">Tap steps below to build sequence</p>}
                            </div>
                            <div className="grid grid-cols-1 gap-2">
                                {puzzle.steps.map((step, idx) => {
                                    if (guessArr.includes(step.id)) return null;
                                    return (
                                        <button key={step.id} onClick={() => handleToggleStep(step.id)} className="p-3 bg-white border border-slate-300 hover:border-indigo-400 rounded shadow-sm text-sm font-medium text-left flex items-center gap-3 active:scale-[0.98]">
                                            <span className="w-6 h-6 rounded bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold shrink-0">{String.fromCharCode(65 + idx)}</span>
                                            {step.text}
                                        </button>
                                    )
                                })}
                            </div>
                            <button onClick={handleSubmit} disabled={guessArr.length !== stepLen} className={`w-full py-4 rounded-xl font-bold transition-all shadow-md flex justify-center gap-2 ${guessArr.length === stepLen ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                Evaluate Sequence ({history.length}/{maxAttempts})
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const SynergyGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver, triggerToast }) => {
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);
            
            const board = currentGuess?.board || [];
            const selected = currentGuess?.selected || [];
            const solved = currentGuess?.solved || [];
            const mistakes = history.length;

            const handleToggle = (item) => {
                if (status !== 'playing') return;
                let newSelected = [...selected];
                if (newSelected.includes(item)) newSelected = newSelected.filter(i => i !== item);
                else if (newSelected.length < 4) newSelected.push(item);
                setGameState(prev => ({ ...prev, currentGuess: { ...prev.currentGuess, selected: newSelected } }));
            };

            const handleSubmit = () => {
                if (selected.length !== 4) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                
                const match = puzzle.categories.find(cat => selected.every(item => cat.items.includes(item)));
                
                if (match) {
                    const newSolved = [...solved, match];
                    const newBoard = board.filter(item => !selected.includes(item));
                    
                    if (newSolved.length === 4) {
                        setGameState(prev => ({ ...prev, currentGuess: { board: newBoard, selected: [], solved: newSolved }, status: 'won' }));
                        onGameOver('won', mistakes);
                    } else {
                        setGameState(prev => ({ ...prev, currentGuess: { board: newBoard, selected: [], solved: newSolved } }));
                        triggerToast("Great Synergy!", false);
                    }
                } else {
                    const isOneAway = puzzle.categories.some(cat => selected.filter(item => cat.items.includes(item)).length === 3);
                    if (isOneAway) triggerToast("One away!", false);
                    else { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); }
                    
                    const newHistory = [...history, selected];
                    if (newHistory.length >= maxAttempts) {
                        setGameState(prev => ({ ...prev, history: newHistory, currentGuess: { ...prev.currentGuess, selected: [] }, status: 'lost' }));
                        onGameOver('lost', newHistory.length);
                    } else {
                        setGameState(prev => ({ ...prev, history: newHistory, currentGuess: { ...prev.currentGuess, selected: [] } }));
                    }
                }
            };

            return (
                <div className="flex flex-col h-full animate-fade-in max-w-lg mx-auto w-full">
                    <p className="text-center font-medium text-slate-600 mb-6">Create 4 groups of 4 related concepts.</p>
                    
                    <div className="flex flex-col gap-2 mb-4">
                        {solved.map((cat, idx) => (
                            <div key={idx} className={`${cat.bgClass} border-2 rounded-xl p-4 text-center animate-pop shadow-sm`}>
                                <div className={`font-bold text-sm mb-1`}>{cat.title}</div>
                                <div className={`text-xs`}>{cat.items.join(", ")}</div>
                            </div>
                        ))}
                    </div>

                    {status === 'playing' ? (
                        <div className={`grid grid-cols-4 gap-2 mb-8 ${isShaking ? 'animate-shake' : ''}`}>
                            {board.map((item, idx) => {
                                const isSelected = selected.includes(item);
                                return (
                                    <button 
                                        key={idx} onClick={() => handleToggle(item)}
                                        className={`aspect-square flex items-center justify-center rounded-xl p-2 text-[10px] sm:text-xs md:text-sm font-bold transition-all break-words shadow-sm leading-tight
                                            ${isSelected ? 'bg-slate-800 text-white scale-95 shadow-inner' : 'bg-slate-100 text-slate-800 hover:bg-slate-200'}
                                        `}
                                    >
                                        {item}
                                    </button>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="grid grid-cols-4 gap-2 mb-8 opacity-50">
                             {board.map((item, idx) => (
                                <div key={idx} className="aspect-square flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 p-2 text-xs md:text-sm font-bold">
                                    {item}
                                </div>
                             ))}
                        </div>
                    )}

                    {status === 'playing' && (
                        <div className="mt-auto">
                            <div className="flex justify-center gap-2 mb-6">
                                <span className="text-sm font-bold text-slate-500 mr-2">Mistakes remaining:</span>
                                {[...Array(maxAttempts - mistakes)].map((_, i) => (
                                    <div key={i} className="w-4 h-4 rounded-full bg-slate-400"></div>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setGameState(prev => ({...prev, currentGuess: { ...prev.currentGuess, selected: [] }}))} className="flex-1 py-4 rounded-full font-bold bg-white border border-slate-300 text-slate-600 shadow-sm active:scale-95 transition-transform">Deselect</button>
                                <button onClick={handleSubmit} disabled={selected.length !== 4} className={`flex-1 py-4 rounded-full font-bold shadow-md transition-all ${selected.length === 4 ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>Submit</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const WordflowerGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver, triggerToast }) => {
            const { history, status } = gameState; // history tracks found words & invalid attempts
            const [currentGuess, setCurrentGuess] = useState("");
            const [isShaking, setIsShaking] = useState(false);
            
            const foundWords = history.filter(h => h.status !== 'invalid').map(h => h.guess);
            const mistakes = history.filter(h => h.status === 'invalid').length;

            const onKeyPress = useCallback((key) => {
                if (status !== 'playing') return;
                
                if (key === 'ENTER') {
                    if (currentGuess.length < 4) {
                        triggerToast("Word must be at least 4 letters.", true);
                        setIsShaking(true); setTimeout(() => setIsShaking(false), 500);
                        return;
                    }
                    if (!currentGuess.includes(puzzle.center)) {
                        triggerToast("Must include the center letter.", true);
                        setIsShaking(true); setTimeout(() => setIsShaking(false), 500);
                        return;
                    }
                    if (foundWords.includes(currentGuess)) {
                        triggerToast("Already found!", true);
                        setIsShaking(true); setTimeout(() => setIsShaking(false), 500);
                        setCurrentGuess("");
                        return;
                    }

                    const isValid = puzzle.validWords.includes(currentGuess);
                    const isPangram = currentGuess === puzzle.pangram;
                    
                    const newEntry = { guess: currentGuess, status: isPangram ? 'pangram' : (isValid ? 'valid' : 'invalid') };
                    const newHistory = [...history, newEntry];
                    const newMistakes = newHistory.filter(h => h.status === 'invalid').length;

                    let newStatus = 'playing';
                    if (isPangram) newStatus = 'won';
                    else if (newMistakes >= maxAttempts) newStatus = 'lost';

                    setGameState(prev => ({ ...prev, history: newHistory, status: newStatus }));
                    setCurrentGuess("");

                    if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
                    else if (isValid) triggerToast("Great job!", false);
                    else { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); }

                } else if (key === 'BACKSPACE') {
                    setCurrentGuess(prev => prev.slice(0, -1));
                } else if (puzzle.letters.includes(key)) {
                    setCurrentGuess(prev => prev + key);
                }
            }, [currentGuess, history, status, puzzle, foundWords, maxAttempts, setGameState, onGameOver, triggerToast]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (status !== 'playing') return;
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    
                    const key = e.key.toUpperCase();
                    if (key === 'ENTER') onKeyPress('ENTER');
                    else if (key === 'BACKSPACE') onKeyPress('BACKSPACE');
                    else if (puzzle.letters.includes(key)) onKeyPress(key);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onKeyPress, status, puzzle]);

            // Hexagon layout math
            const R = 75; // radius in pixels
            const petalPositions = [
                { x: 0, y: -R }, // top
                { x: R * 0.866, y: -R * 0.5 }, // top right
                { x: R * 0.866, y: R * 0.5 }, // bottom right
                { x: 0, y: R }, // bottom
                { x: -R * 0.866, y: R * 0.5 }, // bottom left
                { x: -R * 0.866, y: -R * 0.5 }, // top left
            ];

            const sortedValidHistory = history.filter(h => h.status !== 'invalid').sort((a,b) => b.guess.length - a.guess.length);

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Target</span>
                        <p className="text-slate-800 font-semibold mt-1 text-sm">Find the corporate PANGRAM (7 letters) to win.</p>
                    </div>
                    
                    <div className="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full relative mb-4">
                        <div className={`h-12 border-b-2 flex items-center justify-center text-3xl font-bold tracking-widest uppercase text-slate-800 mb-6 ${isShaking ? 'border-rose-400 text-rose-500 animate-shake' : 'border-slate-200'}`}>
                            {currentGuess || <span className="text-slate-200">...</span>}
                        </div>

                        {status === 'playing' ? (
                            <div className="relative w-72 h-72 mx-auto flex items-center justify-center">
                                {/* Center Petal */}
                                <button 
                                    onClick={() => onKeyPress(puzzle.center)} 
                                    className="absolute w-24 h-24 hex-cell bg-amber-400 text-slate-900 flex items-center justify-center text-3xl font-extrabold active:scale-95 transition-transform z-20"
                                >
                                    {puzzle.center}
                                </button>
                                {/* Outer Petals */}
                                {puzzle.outerLetters.map((letter, idx) => (
                                    <button 
                                        key={idx} 
                                        onClick={() => onKeyPress(letter)} 
                                        className="absolute w-24 h-24 hex-cell bg-slate-200 text-slate-700 flex items-center justify-center text-2xl font-bold active:scale-95 transition-transform hover:bg-slate-300 z-10"
                                        style={{ transform: `translate(${petalPositions[idx].x}px, ${petalPositions[idx].y}px)` }}
                                    >
                                        {letter}
                                    </button>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center p-6 bg-emerald-50 rounded-2xl border border-emerald-100 animate-pop">
                                <p className="text-sm font-bold text-emerald-600 uppercase mb-2">The Pangram Was</p>
                                <p className="text-4xl font-black text-emerald-900 tracking-widest">{puzzle.pangram}</p>
                            </div>
                        )}
                    </div>

                    <div className="mt-auto max-w-lg mx-auto w-full">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-4 flex flex-col max-h-32">
                            <div className="flex justify-between items-center mb-2 shrink-0 border-b border-slate-100 pb-2">
                                <span className="text-xs font-bold text-slate-400 uppercase">Words Found ({sortedValidHistory.length})</span>
                                <span className="text-xs font-bold text-rose-500 uppercase">Errors: {mistakes}/{maxAttempts}</span>
                            </div>
                            <div className="flex flex-wrap gap-1.5 overflow-y-auto hide-scrollbar flex-1 pt-1">
                                {sortedValidHistory.map((h, i) => (
                                    <span key={i} className={`px-2 py-1 text-[10px] font-bold rounded ${h.status === 'pangram' ? 'bg-amber-400 text-amber-900' : 'bg-slate-100 text-slate-600'}`}>{h.guess}</span>
                                ))}
                                {sortedValidHistory.length === 0 && <span className="text-xs text-slate-400 italic">No words found yet...</span>}
                            </div>
                        </div>
                        {status === 'playing' && (
                            <div className="flex gap-2">
                                <button onClick={() => onKeyPress('BACKSPACE')} className="flex-1 py-4 bg-slate-200 text-slate-700 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center"><Icon name="delete" className="w-5 h-5" /></button>
                                <button onClick={() => onKeyPress('ENTER')} className="flex-[2] py-4 bg-slate-900 text-white rounded-xl font-bold active:scale-95 transition-transform shadow-md">Enter</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CrosswordGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const { target, across, down } = puzzle;
            const size = 4;
            const { history, currentGuess, status } = gameState;
            const [activeCell, setActiveCell] = useState(0);
            const [direction, setDirection] = useState('across'); 
            const [isShaking, setIsShaking] = useState(false);

            const grid = Array.isArray(currentGuess) ? currentGuess : Array(16).fill('');

            const clueNumbers = {};
            [...across, ...down].forEach(c => {
                if (c.idx !== undefined) clueNumbers[c.idx] = c.num;
            });

            const getActiveWordIndices = () => {
                let indices = [];
                if (direction === 'across') {
                    const rowStart = Math.floor(activeCell / size) * size;
                    for (let i = 0; i < size; i++) indices.push(rowStart + i);
                } else {
                    const colStart = activeCell % size;
                    for (let i = 0; i < size; i++) indices.push(colStart + i * size);
                }
                return indices;
            };

            const activeIndices = getActiveWordIndices();
            
            const handleCellClick = (idx) => {
                if (status !== 'playing') return;
                if (activeCell === idx) setDirection(prev => prev === 'across' ? 'down' : 'across');
                else setActiveCell(idx);
            };

            const submitGrid = useCallback(() => {
                if (grid.includes('')) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                
                const evaluation = evaluateAttempt(grid, target.split(''));
                const newHistory = [...history, { guess: [...grid], evaluation }];
                
                let newStatus = 'playing';
                if (evaluation.every(e => e === 'correct')) newStatus = 'won';
                else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                
                setGameState(prev => ({ ...prev, history: newHistory, status: newStatus }));
                if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
                else { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); }
            }, [grid, target, history, maxAttempts, setGameState, onGameOver]);

            const onKeyPress = useCallback((key) => {
                if (status !== 'playing') return;
                
                if (key === 'ENTER') {
                    submitGrid();
                } else if (key === 'BACKSPACE') {
                    if (grid[activeCell] !== '') {
                        const newGrid = [...grid];
                        newGrid[activeCell] = '';
                        setGameState(prev => ({...prev, currentGuess: newGrid}));
                    } else {
                        let prevCell = direction === 'across' ? activeCell - 1 : activeCell - size;
                        if (direction === 'across' && activeCell % size !== 0) {
                            const newGrid = [...grid];
                            newGrid[prevCell] = '';
                            setGameState(prev => ({...prev, currentGuess: newGrid}));
                            setActiveCell(prevCell);
                        } else if (direction === 'down' && activeCell - size >= 0) {
                            const newGrid = [...grid];
                            newGrid[prevCell] = '';
                            setGameState(prev => ({...prev, currentGuess: newGrid}));
                            setActiveCell(prevCell);
                        }
                    }
                } else if (/^[A-Z]$/.test(key) && key.length === 1) {
                    const newGrid = [...grid];
                    newGrid[activeCell] = key;
                    setGameState(prev => ({...prev, currentGuess: newGrid}));
                    
                    if (direction === 'across' && (activeCell + 1) % size !== 0) setActiveCell(activeCell + 1);
                    else if (direction === 'down' && activeCell + size < size * size) setActiveCell(activeCell + size);
                }
            }, [activeCell, direction, grid, status, size, setGameState, submitGrid]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (status !== 'playing') return;
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    
                    if (e.key === 'Enter') { e.preventDefault(); onKeyPress('ENTER'); }
                    else if (e.key === 'Backspace') { e.preventDefault(); onKeyPress('BACKSPACE'); }
                    else if (/^[A-Za-z]$/.test(e.key) && e.key.length === 1) { e.preventDefault(); onKeyPress(e.key.toUpperCase()); }
                    else if (e.key === 'ArrowRight' && (activeCell + 1) % size !== 0) setActiveCell(activeCell + 1);
                    else if (e.key === 'ArrowLeft' && activeCell % size !== 0) setActiveCell(activeCell - 1);
                    else if (e.key === 'ArrowDown' && activeCell + size < size * size) setActiveCell(activeCell + size);
                    else if (e.key === 'ArrowUp' && activeCell - size >= 0) setActiveCell(activeCell - size);
                    else if (e.key === 'Tab' || e.key === ' ') { e.preventDefault(); setDirection(prev => prev === 'across' ? 'down' : 'across'); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [activeCell, direction, onKeyPress, status, size]);

            const getActiveClue = () => {
                const arr = direction === 'across' ? across : down;
                const startIdx = direction === 'across' ? Math.floor(activeCell / size) * size : activeCell % size;
                const clueObj = arr.find(c => c.idx === startIdx);
                return clueObj ? `${clueObj.num} ${direction.toUpperCase()}: ${clueObj.clue}` : '';
            };

            const cellColors = Array(16).fill('bg-white text-slate-800 border-slate-200');
            const keyColors = {};

            if (history.length > 0) {
                const latestAttempt = history[history.length - 1];
                
                latestAttempt.evaluation.forEach((ev, i) => { 
                    if (grid[i] === latestAttempt.guess[i] && grid[i] !== '') {
                        if (ev === 'correct') cellColors[i] = 'bg-emerald-500 text-white border-emerald-600';
                        else if (ev === 'present') cellColors[i] = 'bg-amber-400 text-white border-amber-500';
                        else if (ev === 'absent') cellColors[i] = 'bg-rose-500 text-white border-rose-600';
                    }
                });

                history.forEach((attempt) => {
                    attempt.guess.forEach((letter, i) => {
                        if (letter === '') return;
                        const evalState = attempt.evaluation[i];
                        if (evalState === 'correct') keyColors[letter] = 'bg-emerald-500 text-white';
                        else if (evalState === 'present' && !keyColors[letter]?.includes('emerald')) keyColors[letter] = 'bg-amber-400 text-white';
                        else if (evalState === 'absent' && !keyColors[letter]) keyColors[letter] = 'bg-rose-500 text-white opacity-60';
                    });
                });
            }

            const keys = [['Q','W','E','R','T','Y','U','I','O','P'], ['A','S','D','F','G','H','J','K','L'], ['Z','X','C','V','B','N','M','BACKSPACE']];

            return (
                <div className="flex flex-col h-full animate-fade-in max-w-sm mx-auto w-full">
                    <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-xl mb-4 shadow-sm min-h-[60px] flex items-center justify-center transition-all duration-300 relative cursor-pointer" onClick={() => setDirection(prev => prev === 'across' ? 'down' : 'across')}>
                        <div className="absolute top-1 left-2 text-[9px] font-bold text-indigo-400 uppercase tracking-widest">{direction}</div>
                        <p className="text-sm font-bold text-indigo-900 text-center animate-fade-in leading-snug px-2" key={getActiveClue()}>
                            {getActiveClue()}
                        </p>
                    </div>

                    <div className={`grid grid-cols-4 gap-1 mx-auto mb-4 bg-slate-800 p-1 rounded-lg ${isShaking ? 'animate-shake' : ''}`} style={{ width: 'fit-content' }}>
                        {grid.map((char, idx) => {
                            const isFocused = activeCell === idx && status === 'playing';
                            const isHighlighted = activeIndices.includes(idx) && status === 'playing';
                            const isCorrect = status === 'won';
                            
                            return (
                                <div 
                                    key={idx} 
                                    onClick={() => handleCellClick(idx)}
                                    className={`relative w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center text-2xl font-bold uppercase cursor-pointer rounded-sm transition-colors duration-200 border-2
                                        ${isCorrect ? 'bg-emerald-500 text-white border-transparent' : 
                                          isFocused ? `ring-4 ring-indigo-500 z-20 scale-105 shadow-lg ${cellColors[idx] !== 'bg-white text-slate-800 border-slate-200' ? cellColors[idx] : 'bg-amber-100 border-amber-300 text-amber-900'}` : 
                                          isHighlighted ? `${cellColors[idx] !== 'bg-white text-slate-800 border-slate-200' ? cellColors[idx] : 'bg-amber-50 border-amber-200 text-amber-900'}` : 
                                          cellColors[idx]
                                        }
                                    `}
                                >
                                    {clueNumbers[idx] && <span className={`absolute top-0.5 left-1 text-[10px] font-bold leading-none ${isFocused || isHighlighted ? (!cellColors[idx].includes('bg-white') ? 'text-white/80' : 'text-amber-700') : (!cellColors[idx].includes('bg-white') ? 'text-white/80' : 'text-slate-400')}`}>{clueNumbers[idx]}</span>}
                                    {char}
                                </div>
                            )
                        })}
                    </div>

                    {status === 'playing' && (
                        <div className="mt-auto px-1 w-full pb-2">
                            {keys.map((row, rIdx) => (
                                <div key={rIdx} className="flex justify-center gap-1 mb-1.5">
                                    {row.map(key => {
                                        const isSpecial = key.length > 1;
                                        return (
                                            <button key={key} onClick={() => onKeyPress(key)}
                                                className={`h-11 sm:h-12 rounded font-bold text-xs flex items-center justify-center transition-colors shadow-sm
                                                ${isSpecial ? 'px-3 sm:px-4 bg-slate-300 text-slate-700' : 'flex-1 max-w-[36px] bg-slate-200 text-slate-800'}
                                                ${keyColors[key] || ''} active:scale-95`}
                                            >
                                                {key === 'BACKSPACE' ? <Icon name="delete" className="w-5 h-5" /> : key}
                                            </button>
                                        )
                                    })}
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="mt-2">
                        <div className="flex justify-center gap-2 mb-3">
                            {history.map((_, i) => <div key={i} className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pop"></div>)}
                            {[...Array(maxAttempts - history.length)].map((_, i) => <div key={`e-${i}`} className="w-2.5 h-2.5 rounded-full bg-slate-200"></div>)}
                        </div>
                        <button onClick={submitGrid} disabled={status !== 'playing'} className={`w-full py-3.5 rounded-xl font-bold transition-all shadow-md flex justify-center gap-2 ${status === 'playing' ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                            Check Puzzle
                        </button>
                    </div>
                </div>
            );
        };

        const FeedbackForm = () => {
            const [rating, setRating] = useState(0);
            const [hovered, setHovered] = useState(0);
            const [comment, setComment] = useState('');
            const [submitted, setSubmitted] = useState(false);

            if (submitted) {
                return (
                    <div className="mt-4 p-4 bg-emerald-50 border border-emerald-100 rounded-xl text-center animate-fade-in" data-html2canvas-ignore>
                        <Icon name="check-circle-2" className="w-6 h-6 text-emerald-500 mx-auto mb-2" />
                        <p className="text-sm font-bold text-emerald-800">Thank you for your feedback!</p>
                        <p className="text-xs text-emerald-600 mt-1">Your suggestions help us improve.</p>
                    </div>
                );
            }

            return (
                <div className="mt-4 pt-4 border-t border-slate-100 animate-fade-in" data-html2canvas-ignore>
                    <p className="text-xs font-bold text-slate-400 uppercase text-center mb-2">Rate Today's Game</p>
                    <div className="flex justify-center gap-1 mb-3">
                        {[1, 2, 3, 4, 5].map(star => (
                            <button key={star} onMouseEnter={() => setHovered(star)} onMouseLeave={() => setHovered(0)} onClick={() => setRating(star)} className="p-1 transition-transform hover:scale-110 focus:outline-none">
                                <Icon name={(hovered || rating) >= star ? 'star-filled' : 'star'} className={`w-7 h-7 ${((hovered || rating) >= star) ? 'text-amber-400' : 'text-slate-200'}`} />
                            </button>
                        ))}
                    </div>
                    {rating > 0 && (
                        <div className="flex flex-col gap-2 animate-slide-down">
                            <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Any suggestions for today's puzzle? (Optional)" className="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-indigo-500 focus:bg-white transition-colors resize-none h-20"/>
                            <button onClick={() => setSubmitted(true)} className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold active:scale-95 transition-transform">Submit Feedback</button>
                        </div>
                    )}
                </div>
            );
        };

        const AuthModal = ({ isVisible, onClose, onLogin, triggerToast }) => {
            const [isLoading, setIsLoading] = useState(false);

            if (!isVisible) return null;

            const handleLogin = async () => {
                setIsLoading(true);
                try {
                    const user = await CloudDB.loginWithGoogle();
                    onLogin(user);
                    onClose();
                } catch (e) {
                    triggerToast(e.message, true);
                }
                setIsLoading(false);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-pop text-center">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><Icon name="x" className="w-5 h-5" /></button>
                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icon name="user" className="w-8 h-8 text-slate-400" />
                        </div>
                        <h2 className="text-xl font-bold mb-2">Track Global Ranking</h2>
                        <p className="text-sm text-slate-600 mb-6">Sign in to sync your scores to the cloud and compete on the global leaderboard.</p>
                        
                        <button onClick={handleLogin} disabled={isLoading} className="w-full flex items-center justify-center gap-3 py-3 border-2 border-slate-200 rounded-xl font-bold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm active:scale-95 disabled:opacity-50">
                            {isLoading ? (<span className="animate-pulse">Connecting...</span>) : (<><Icon name="google" className="w-5 h-5" />Continue with Google</>)}
                        </button>
                        <p className="text-[10px] text-slate-400 mt-4 px-4">This is a secure connection. Your local stats will not be lost.</p>
                    </div>
                </div>
            );
        }

        const Modals = ({ showHelp, setShowHelp, showStats, setShowStats, stats, timeToMidnight, handleShare, gameType, gameStatus, puzzle, shareImage, setShareImage, isCapturing, downloadImage, shareToApps, currentUser, onOpenAuth, dayIndex, isTestMode }) => {
            const GameTitle = gameType.replace('_', ' ');
            const [activeTab, setActiveTab] = useState('personal'); 
            const [leaderboard, setLeaderboard] = useState([]);
            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);

            useEffect(() => {
                let isMounted = true;
                if (showStats && activeTab === 'global' && !isTestMode) {
                    setLoadingLeaderboard(true);
                    setTimeout(() => {
                        CloudDB.getLeaderboard(gameType, dayIndex).then(data => {
                            if (isMounted) { setLeaderboard(data); setLoadingLeaderboard(false); }
                        });
                    }, 500);
                }
                return () => { isMounted = false; };
            }, [showStats, activeTab, gameType, dayIndex, currentUser, isTestMode]);

            const renderInstructions = (type) => {
                const HowToCard = ({ num, text, colorCls, icon }) => (
                    <div className="flex gap-4 items-start bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm mb-2">
                        <div className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-sm font-bold text-white shadow-sm ${colorCls}`}>{icon || num}</div>
                        <div className="text-sm font-medium text-slate-700 leading-snug">{text}</div>
                    </div>
                );
                
                const LegendCard = ({ color, label, desc }) => (
                    <div className="flex items-center gap-3 py-2 border-b border-slate-100 last:border-0">
                        <div className={`w-8 h-8 rounded shrink-0 shadow-sm ${color}`}></div>
                        <div>
                            <div className="text-xs font-bold text-slate-800">{label}</div>
                            <div className="text-[10px] text-slate-500 font-medium">{desc}</div>
                        </div>
                    </div>
                );

                switch(type) {
                    case 'WORDFLOWER': return (
                        <div className="space-y-1">
                            <HowToCard num="1" colorCls="bg-amber-400" text="Find the corporate PANGRAM (7 letters) to instantly win the game." />
                            <HowToCard num="2" colorCls="bg-indigo-500" text="Create words of at least 4 letters. You MUST use the center letter (yellow) in every word." />
                            <HowToCard icon={<Icon name="alert-triangle" className="w-4 h-4"/>} colorCls="bg-rose-500" text="Choose carefully! Submitting invalid words will consume your attempts." />
                        </div>
                    );
                    case 'JARGON_BUSTER': return (
                        <div className="space-y-1">
                            <HowToCard num="1" colorCls="bg-indigo-500" text="Read the definition to guess the 5-letter corporate buzzword." />
                            <div className="mt-4 p-3 bg-white border border-slate-200 rounded-xl">
                                <p className="text-xs font-bold uppercase text-slate-400 mb-2">Color Guide</p>
                                <LegendCard color="bg-emerald-500" label="Green" desc="Letter is in the word and in the correct spot." />
                                <LegendCard color="bg-amber-400" label="Yellow" desc="Letter is in the word but in the wrong spot." />
                                <LegendCard color="bg-rose-500" label="Red" desc="Letter is absolutely not in the word." />
                            </div>
                        </div>
                    );
                    case 'PROCESS_FLOW': return (
                        <div className="space-y-1">
                            <HowToCard num="1" colorCls="bg-indigo-500" text="Standard Operating Procedures matter! Build the correct chronological sequence." />
                            <HowToCard num="2" colorCls="bg-indigo-400" text="Tap the steps in order. Evaluate your sequence to get feedback." />
                            <div className="mt-4 p-3 bg-white border border-slate-200 rounded-xl">
                                <p className="text-xs font-bold uppercase text-slate-400 mb-2">Color Guide</p>
                                <LegendCard color="bg-emerald-500" label="Green" desc="Step is in the exact right order." />
                                <LegendCard color="bg-amber-400" label="Yellow" desc="Step belongs to the process but is in the wrong order." />
                            </div>
                        </div>
                    );
                    case 'SYNERGY_SQUARE': return (
                        <div className="space-y-1">
                            <HowToCard num="1" colorCls="bg-indigo-500" text="Find groups of 4 items that share a common corporate theme." />
                            <HowToCard num="2" colorCls="bg-indigo-400" text="Select 4 tiles and tap 'Submit' to check if your connection is right." />
                            <HowToCard icon={<Icon name="alert-triangle" className="w-4 h-4"/>} colorCls="bg-rose-500" text="Be careful! You only have 4 mistakes allowed before the game ends." />
                        </div>
                    );
                    case 'MINI_CROSSWORD': return (
                        <div className="space-y-1">
                            <HowToCard num="1" colorCls="bg-indigo-500" text="Solve the 4x4 corporate crossword puzzle." />
                            <HowToCard num="2" colorCls="bg-indigo-400" text="Tap a cell to type, use on-screen keyboard to fill words. Tap current clue to switch direction." />
                            <div className="mt-4 p-3 bg-white border border-slate-200 rounded-xl">
                                <p className="text-xs font-bold uppercase text-slate-400 mb-2">Color Guide</p>
                                <LegendCard color="bg-emerald-500" label="Green" desc="Letter is in the exact correct spot in the grid." />
                                <LegendCard color="bg-amber-400" label="Yellow" desc="Letter exists in the grid, but not in this spot." />
                                <LegendCard color="bg-rose-500" label="Red" desc="Letter is completely wrong." />
                            </div>
                        </div>
                    );
                    default: return <p>Solve the daily logic puzzle before you run out of attempts.</p>;
                }
            };
            
            return (
                <>
                    {showHelp && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-slide-down">
                                <button onClick={() => setShowHelp(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><Icon name="x" className="w-5 h-5" /></button>
                                <h2 className="text-xl font-bold mb-1 text-slate-900">How to Play</h2>
                                <h3 className="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-4 pb-3 border-b border-slate-100">{GameTitle}</h3>
                                
                                {renderInstructions(gameType)}
                                
                                <button onClick={() => setShowHelp(false)} className="w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold mt-6 active:scale-95 transition-transform shadow-lg">Let's Play</button>
                            </div>
                        </div>
                    )}

                    {showStats && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl relative animate-slide-down my-auto overflow-hidden">
                                <button data-html2canvas-ignore onClick={() => {setShowStats(false); setShareImage(null);}} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 z-10"><Icon name="x" className="w-5 h-5" /></button>
                                
                                <div className="flex bg-slate-50 border-b border-slate-200" data-html2canvas-ignore>
                                    <button onClick={() => setActiveTab('personal')} className={`flex-1 py-3 text-xs font-bold transition-colors ${activeTab === 'personal' ? 'text-indigo-700 bg-white border-b-2 border-indigo-600' : 'text-slate-500'}`}>My Stats</button>
                                    {!isTestMode && (
                                        <button onClick={() => setActiveTab('global')} className={`flex-1 py-3 text-xs font-bold transition-colors flex items-center justify-center gap-1 ${activeTab === 'global' ? 'text-indigo-700 bg-white border-b-2 border-indigo-600' : 'text-slate-500'}`}>
                                            <Icon name="trophy" className="w-3 h-3" /> Global
                                        </button>
                                    )}
                                </div>

                                {activeTab === 'personal' && (
                                    <>
                                        <div id="capture-node" className="p-6 bg-white relative">
                                            <div className="text-center mb-6 border-b border-slate-100 pb-4">
                                                <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">CorpQuest</h1>
                                                <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">{GameTitle}</p>
                                            </div>

                                            {gameStatus !== 'playing' && (
                                                <div className="mb-6 border-b border-slate-100 pb-6 text-center">
                                                    <div className="text-5xl mb-3">{gameStatus === 'won' ? '🏆' : '📉'}</div>
                                                    <h2 className="text-2xl font-bold text-slate-900 mb-1">{gameStatus === 'won' ? 'Excellent Work!' : 'Tough Luck.'}</h2>
                                                    {gameStatus === 'won' && !isTestMode && (
                                                        <div className="text-sm font-bold text-emerald-600 bg-emerald-50 py-1 px-3 rounded-full inline-block mt-2 border border-emerald-100 shadow-sm">
                                                            Score: {stats.lastScore || 0} pts
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {gameStatus !== 'playing' && puzzle?.trivia && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-left shadow-sm">
                                                    <h4 className="flex items-center gap-2 text-amber-800 font-bold mb-2"><Icon name="lightbulb" className="w-5 h-5" /> Fun Fact</h4>
                                                    <p className="text-sm text-amber-900 leading-relaxed font-medium">{puzzle.trivia}</p>
                                                </div>
                                            )}

                                            {isTestMode ? (
                                                <div className="bg-rose-50 border border-rose-100 p-4 rounded-xl text-center">
                                                    <p className="text-sm font-bold text-rose-800 mb-1">Test Drive Complete</p>
                                                    <p className="text-xs text-rose-600">This score is not saved to your local history or the global leaderboard.</p>
                                                </div>
                                            ) : (
                                                <>
                                                    <h3 className="text-sm font-bold uppercase text-slate-400 mb-4 text-center">{GameTitle} Stats</h3>
                                                    <div className="grid grid-cols-4 gap-2 text-center">
                                                        <div className="flex flex-col"><span className="text-xl font-bold">{stats.played}</span><span className="text-[10px] uppercase text-slate-500">Played</span></div>
                                                        <div className="flex flex-col"><span className="text-xl font-bold">{stats.played > 0 ? Math.round((stats.wins/stats.played)*100) : 0}</span><span className="text-[10px] uppercase text-slate-500">Win %</span></div>
                                                        <div className="flex flex-col"><span className="text-xl font-bold">{stats.currentStreak}</span><span className="text-[10px] uppercase text-slate-500">Streak</span></div>
                                                        <div className="flex flex-col"><span className="text-xl font-bold">{stats.maxStreak}</span><span className="text-[10px] uppercase text-slate-500">Max</span></div>
                                                    </div>
                                                    
                                                    {/* SCORE HISTORY CHART */}
                                                    {stats.scoreHistory && stats.scoreHistory.length > 0 && (
                                                        <div className="mt-6 pt-4 border-t border-slate-100">
                                                            <h3 className="text-xs font-bold uppercase text-slate-400 mb-3 text-center">Score History (Last 5)</h3>
                                                            <div className="flex items-end justify-center h-20 gap-3">
                                                                {stats.scoreHistory.map((s, i) => {
                                                                    const heightPct = Math.max(15, (s / 5000) * 100);
                                                                    return (
                                                                        <div key={i} className="flex flex-col items-center gap-1 w-8 group">
                                                                            <span className="text-[9px] font-bold text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity">{s}</span>
                                                                            <div className="w-full bg-indigo-500 rounded-t-md animate-grow-up shadow-sm hover:bg-indigo-400 transition-colors" style={{ '--target-height': `${heightPct}%` }}></div>
                                                                        </div>
                                                                    )
                                                                })}
                                                            </div>
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </div>

                                        {gameStatus !== 'playing' && (
                                            <div data-html2canvas-ignore className="p-6 pt-0 bg-white">
                                                {shareImage && !isTestMode ? (
                                                    <div className="flex flex-col gap-3 animate-fade-in">
                                                        <div className="text-center text-xs font-bold text-slate-400 uppercase">Preview Share</div>
                                                        <img src={shareImage} className="w-48 mx-auto rounded-lg border-2 border-slate-200 shadow-md mb-2" alt="Screenshot Result" />
                                                        <div className="flex gap-2">
                                                            <button onClick={downloadImage} className="flex-1 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl py-3 font-bold text-sm transition-colors flex items-center justify-center gap-2 shadow-sm">
                                                                <Icon name="download" className="w-4 h-4" /> Save Image
                                                            </button>
                                                            <button onClick={shareToApps} className="flex-1 bg-gradient-to-tr from-pink-500 to-orange-400 text-white hover:opacity-90 rounded-xl py-3 font-bold text-sm transition-opacity shadow-md flex items-center justify-center gap-2">
                                                                <Icon name="instagram" className="w-4 h-4" /> IG Story
                                                            </button>
                                                        </div>
                                                        <button onClick={() => setShareImage(null)} className="w-full text-xs text-slate-500 mt-2 font-bold py-2 hover:text-slate-800">Cancel</button>
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col">
                                                        {isTestMode ? (
                                                            <button onClick={() => window.location.reload()} className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-md hover:bg-slate-800 transition-colors">
                                                                Return to Daily Game
                                                            </button>
                                                        ) : (
                                                            <div className="flex gap-3">
                                                                <div className="flex-1 bg-slate-100 rounded-xl p-3 text-center border border-slate-200">
                                                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Next Puzzle</p>
                                                                    <p className="text-lg font-mono font-bold text-slate-800">{timeToMidnight}</p>
                                                                </div>
                                                                <button onClick={handleShare} disabled={isCapturing} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition-colors shadow-md">
                                                                    {isCapturing ? 'Capturing...' : <><Icon name="camera" className="w-4 h-4" /> Screenshot</>}
                                                                </button>
                                                            </div>
                                                        )}
                                                        {!isTestMode && <FeedbackForm />}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}

                                {activeTab === 'global' && !isTestMode && (
                                    <div className="p-6 bg-white min-h-[400px]">
                                        {!currentUser ? (
                                            <div className="text-center pt-8">
                                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                                    <Icon name="trophy" className="w-8 h-8 text-amber-400" />
                                                </div>
                                                <h3 className="font-bold text-lg mb-2">Global Leaderboard</h3>
                                                <p className="text-sm text-slate-500 mb-6">Sign in to see how you stack up against other corporate warriors.</p>
                                                <button onClick={onOpenAuth} className="bg-slate-900 text-white px-6 py-2.5 rounded-full font-bold shadow-md hover:bg-slate-800 active:scale-95 transition-all">Sign In to View</button>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="text-center mb-6">
                                                    <h3 className="font-bold text-lg">{GameTitle} Today</h3>
                                                    <p className="text-xs text-slate-500">Ranked by Score & Speed</p>
                                                </div>
                                                {loadingLeaderboard ? (
                                                    <div className="text-center text-slate-400 py-10 animate-pulse">Loading scores...</div>
                                                ) : (
                                                    <div className="space-y-2">
                                                        {leaderboard.map((user, idx) => (
                                                            <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl border ${user.isMe ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white border-slate-100'}`}>
                                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-amber-100 text-amber-600' : idx === 1 ? 'bg-slate-200 text-slate-600' : idx === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-400'}`}>
                                                                    {idx + 1}
                                                                </div>
                                                                <div className="flex-1">
                                                                    <div className="text-sm font-bold flex items-center gap-1 text-slate-800">
                                                                        {user.name} {user.isMe && <span className="text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded ml-1">YOU</span>}
                                                                    </div>
                                                                    <div className="text-[10px] text-slate-500">{user.time}s</div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="text-sm font-bold text-indigo-600">{user.score}</div>
                                                                    <div className="text-[10px] text-slate-400 uppercase">PTS</div>
                                                                </div>
                                                            </div>
                                                        ))}
