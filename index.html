        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            if(event.keyCode == 123) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } 
        }
    </script>

        const EPOCH_DATE = new Date('2026-05-28T00:00:00'); 
        const ADMIN_PASSWORD = "7Tanjungtirta!";

        const seededRNG = (seed) => {
            let t = seed += 0x6D2B79F5;
            return () => {
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        };

        const pickRandom = (arr, rng) => arr[Math.floor(rng() * arr.length)];
        const shuffleArray = (arr, rng) => {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const CloudDB = {
            loginWithGoogle: async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    const result = await auth.signInWithPopup(provider);
                    return {
                        uid: result.user.uid,
                        name: result.user.displayName || result.user.email.split('@')[0],
                        email: result.user.email
                    };
                } catch (error) {
                    console.error("Google Auth Error:", error);
                    throw error;
                }
            },
            saveScore: async (user, gameType, dayIndex, score, timeInSeconds) => {
                if (!user || !user.uid) return;
                try {
                    const docRef = db.collection('corpquest_leaderboard').doc(`${gameType}_day${dayIndex}`).collection('scores').doc(user.uid);
                    await docRef.set({
                        uid: user.uid, name: user.name, score: score, time: timeInSeconds, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (error) { console.error("Error saving score:", error); }
            },
            getLeaderboard: async (gameType, currentDayIndex) => {
                try {
                    const snapshot = await db.collection('corpquest_leaderboard').doc(`${gameType}_day${currentDayIndex}`).collection('scores').orderBy('score', 'desc').orderBy('time', 'asc').limit(10).get();
                    let scores = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        scores.push({ id: doc.id, name: data.name, score: data.score, time: data.time, isMe: auth.currentUser && doc.id === auth.currentUser.uid });
                    });
                    return scores;
                } catch (error) { console.error("Error fetching leaderboard:", error); return []; }
            }
        };

        const calculateScore = (hasWon, attempts, maxAttempts, timeInSeconds) => {
            if (!hasWon) return 100 * attempts; 
            let score = 5000;
            score += (maxAttempts - attempts) * 1000; 
            const speedBonus = Math.max(0, 3000 - (timeInSeconds * 10)); 
            score += speedBonus;
            return Math.floor(score);
        };

        const NAMES = ['Alex', 'Jordan', 'Taylor', 'Sam', 'Casey', 'Morgan', 'Riley', 'Jamie', 'Dakota', 'Quinn'];
        
        const TALENT_POOLS = [
            { roles: ["UI/UX Intern", "Backend Dev", "IT Support", "Data Analyst"], clues: (c) => [`${c[0]} has an amazing portfolio but lacks backend skills.`, `The Backend Dev position must be filled by ${c[1]}.`, `${c[4]} (Red Flag) demanded a salary triple our budget.`, `${c[2]} loves fixing hardware and resetting passwords.`, `${c[3]} excels at VBA and SQL database management.`] },

        ];

        const JARGON_BANK = [
            { word: 'PIVOT', clue: "A fundamental shift in business strategy to avoid failure.", trivia: "YouTube originally started as a video dating site called 'Tune In Hook Up' before doing this to become a general video platform." },
            { word: 'CHURN', clue: "The rate at which employees leave a workforce.", trivia: "A high churn rate can cost a company up to 1.5x the annual salary of the departing employees." },

        ];

        const PROCESS_BANK = [
            { title: "Standard Offboarding", desc: "Arrange chronological order of resignation.", steps: ["Receive Formal Resignation", "Notify IT & Security", "Conduct Exit Interview", "Process Final Pay", "Deactivate Badges"], trivia: "A structured offboarding process reduces the risk of data breaches from former employees by 70%." },
            { title: "Discipline Escalation", desc: "Order the stages of progressive discipline.", steps: ["Verbal Warning", "Written Warning", "Performance Improvement Plan", "Final Warning", "Termination"], trivia: "Progressive discipline policies protect companies from wrongful termination lawsuits by establishing a documented trail of intervention." }
        ];

        const SYNERGY_BANK = [
            {
                categories: [
                    { title: "MEETING TYPES", items: ["STANDUP", "ALL HANDS", "1ON1", "TOWN HALL"], bg: "bg-amber-300", text: "text-amber-900" },
                    { title: "DEPARTMENTS", items: ["SALES", "MARKETING", "FINANCE", "LEGAL"], bg: "bg-emerald-300", text: "text-emerald-900" },

                ],
                trivia: "The term 'Synergy' became a massively overused corporate buzzword in the late 1990s."
            }
        ];

        const CROSSWORD_BANK = [
            {
                target: "TIMEIDEAMEETEATS",
                across: [
                    { num: 1, clue: "Clock concept" },
                    { num: 5, clue: "Brainstorm result" },
                    { num: 6, clue: "Gather in a conference room" },
                    { num: 7, clue: "Lunches at the desk" }
                ],
                down: [
                    { num: 1, clue: "Timesheet entry" },
                    { num: 2, clue: "'I have an ___!'" },

                ],
                trivia: "Mini crosswords improve memory retention and problem-solving skills in under 2 minutes."

            }
        ];

        const getPuzzleDataForIndex = (dayIndex) => {
            if (dayIndex < 0) return null;
            const rng = seededRNG(dayIndex + 2000); 
            
            // 5 Best NYT-inspired Games Rotation
            const GAME_TYPES = ['JARGON_BUSTER', 'TALENT_GRID', 'SYNERGY_SQUARE', 'PROCESS_FLOW', 'MINI_CROSSWORD'];
            
            const gameType = GAME_TYPES[dayIndex % 5];
            let puzzleData = {};

            if (gameType === 'TALENT_GRID') {
                const pool = pickRandom(TALENT_POOLS, rng);
                const candidates = shuffleArray([...NAMES], rng).slice(0, 5); 
                puzzleData = {
                    roles: pool.roles, candidates,
                    solution: { [pool.roles[0]]: candidates[0], [pool.roles[1]]: candidates[1], [pool.roles[2]]: candidates[2], [pool.roles[3]]: candidates[3] },
                    clues: pool.clues(candidates),
                    trivia: "A bad hire can cost a company up to 30% of the employee's first-year earnings in lost productivity."
                };
            } 
            else if (gameType === 'JARGON_BUSTER') puzzleData = dayIndex === 0 ? JARGON_BANK[0] : pickRandom(JARGON_BANK, rng);
            else if (gameType === 'PROCESS_FLOW') {
                const base = pickRandom(PROCESS_BANK, rng);
                puzzleData = {
                    title: base.title, desc: base.desc, trivia: base.trivia,
                    steps: base.steps.map((text, i) => ({ id: String.fromCharCode(65 + i), text })),
                    solution: base.steps.map((_, i) => String.fromCharCode(65 + i))
                };
            }
            else if (gameType === 'SYNERGY_SQUARE') {
                puzzleData = pickRandom(SYNERGY_BANK, rng);
            }
            else if (gameType === 'MINI_CROSSWORD') {
                puzzleData = pickRandom(CROSSWORD_BANK, rng);
            }
            
            const targetDate = new Date(EPOCH_DATE);
            targetDate.setDate(targetDate.getDate() + dayIndex);

            return { 
                dayIndex, gameType, puzzleData, 
                dateStr: targetDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) 
            };
        };

        const getDayParams = () => {
            const now = new Date();
            const localDateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const localNow = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const localEpoch = new Date(EPOCH_DATE.getFullYear(), EPOCH_DATE.getMonth(), EPOCH_DATE.getDate());
            
            const diffTime = Math.abs(localNow - localEpoch);
            const dayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            const { gameType, puzzleData } = getPuzzleDataForIndex(dayIndex);
            
            let maxAttempts = 5;
            if (gameType === 'JARGON_BUSTER') maxAttempts = 6;
            if (gameType === 'PROCESS_FLOW') maxAttempts = 4;
            if (gameType === 'SYNERGY_SQUARE') maxAttempts = 4; // Max mistakes allowed
            if (gameType === 'MINI_CROSSWORD') maxAttempts = 5;

            return { dayIndex, gameType, puzzleData, maxAttempts, todayStr: localDateStr, rngSeed: dayIndex + 2000 };
        };

        const evaluateAttempt = (guessArray, targetArray) => {
            let result = Array(targetArray.length).fill('absent');
            let targetCopy = [...targetArray];
            guessArray.forEach((val, i) => {
                if (val === targetCopy[i]) { result[i] = 'correct'; targetCopy[i] = null; }
            });
            guessArray.forEach((val, i) => {
                if (result[i] !== 'correct' && targetCopy.includes(val)) {
                    result[i] = 'present'; targetCopy[targetCopy.indexOf(val)] = null;
                }
            });
            return result;
        };

        const Toast = ({ message, isVisible }) => (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                <div className="bg-slate-900 text-white px-6 py-3 rounded-full shadow-xl text-sm font-semibold flex items-center gap-2">
                    <Icon name="check-circle-2" className="w-4 h-4 text-emerald-400" />
                    {message}
                </div>
            </div>
        );

        const Confetti = () => {
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];
            return (
                <div className="fixed inset-0 pointer-events-none z-[90] overflow-hidden">
                    {[...Array(40)].map((_, i) => (
                        <div key={i} className="absolute w-3 h-3 rounded-sm animate-confetti-fall"
                            style={{ left: `${Math.random() * 100}%`, backgroundColor: colors[i % colors.length], animationDelay: `${Math.random() * 2}s`, animationDuration: `${2 + Math.random() * 2}s` }}
                        />
                    ))}
                </div>
            );
        };

        const GridGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [isShaking, setIsShaking] = useState(false);
            const { history, currentGuess, status } = gameState;

            const handleSelect = (c) => status === 'playing' && setSelectedCandidate(c === selectedCandidate ? null : c);
            const handleAssign = (role) => {
                if (status !== 'playing') return;
                if (selectedCandidate) {
                    const newGuess = { ...currentGuess };
                    Object.keys(newGuess).forEach(k => { if (newGuess[k] === selectedCandidate) newGuess[k] = ''; });
                    newGuess[role] = selectedCandidate;
                    setGameState(prev => ({ ...prev, currentGuess: newGuess }));
                    setSelectedCandidate(null);
                } else if (currentGuess[role] !== '') {
                    setGameState(prev => ({ ...prev, currentGuess: { ...prev.currentGuess, [role]: '' } }));
                }
            };

            const handleSubmit = () => {
                if (Object.values(currentGuess).some(v => v === '')) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                const guessArray = puzzle.roles.map(r => currentGuess[r]);
                const evaluation = guessArray.map(guessed => {
                    const index = puzzle.roles.findIndex(r => currentGuess[r] === guessed);
                    if (puzzle.solution[puzzle.roles[index]] === guessed) return 'correct';
                    if (Object.values(puzzle.solution).includes(guessed)) return 'present';
                    return 'absent'; 
                });

                const newHistory = [...history, { guess: { ...currentGuess }, evaluation }];
                let newStatus = 'playing';
                if (evaluation.every(e => e === 'correct')) newStatus = 'won';
                else if (newHistory.length >= maxAttempts) newStatus = 'lost';

                const nextGuess = {};
                if (newStatus === 'playing') puzzle.roles.forEach((r, i) => nextGuess[r] = evaluation[i] === 'correct' ? currentGuess[r] : '');

                setGameState({ history: newHistory, currentGuess: nextGuess, status: newStatus });
                if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
            };

            const assigned = Object.values(currentGuess).filter(c => c !== '');

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 max-h-48 overflow-y-auto hide-scrollbar relative">
                        <div className="sticky top-0 bg-white pb-1 mb-2 border-b border-slate-100 z-10">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-slate-400">Dossier / Clues</h2>
                        </div>
                        <ul className="text-sm text-slate-700 font-medium space-y-1.5">
                            {puzzle.clues.map((c, i) => <li key={i} className="flex gap-2"><span className="text-indigo-500 shrink-0">•</span><span>{c}</span></li>)}
                        </ul>
                    </div>
                    <div className="flex-1 flex flex-col justify-center gap-2 mb-4 max-w-md mx-auto w-full">
                        {[...Array(maxAttempts)].map((_, rIdx) => {
                            const attempt = history[rIdx];
                            const isActive = rIdx === history.length && status === 'playing';
                            return (
                                <div key={rIdx} className={`flex gap-2 ${isActive && isShaking ? 'animate-shake' : ''}`}>
                                    {puzzle.roles.map((role, cIdx) => {
                                        const state = attempt ? attempt.evaluation[cIdx] : (isActive && currentGuess[role] ? 'tbd' : 'empty');
                                        const text = attempt ? attempt.guess[role] : (isActive ? currentGuess[role] : '');
                                        return (
                                            <div key={cIdx} className={`flex-1 h-12 flex items-center justify-center rounded text-sm font-bold border-2 transition-all duration-500
                                                ${state === 'empty' ? 'bg-white border-slate-200 text-slate-400' : ''}
                                                ${state === 'tbd' ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : ''}
                                                ${state === 'correct' ? 'bg-correct animate-flip' : ''}
                                                ${state === 'present' ? 'bg-present animate-flip' : ''}
                                                ${state === 'absent' ? 'bg-absent animate-flip' : ''}
                                            `} style={{ animationDelay: attempt ? `${cIdx * 0.15}s` : '0s' }}>{text}</div>
                                        )
                                    })}
                                </div>
                            )
                        })}
                    </div>
                    {status === 'playing' && (
                        <div className="bg-white p-4 rounded-2xl shadow-[0_-5px_20px_-10px_rgba(0,0,0,0.1)] border border-slate-200 mt-auto">
                            <p className="text-center text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">1. Select Name</p>
                            <div className="flex flex-wrap justify-center gap-2 mb-4">
                                {puzzle.candidates.map(c => (
                                    <button key={c} onClick={() => handleSelect(c)} disabled={assigned.includes(c) && selectedCandidate !== c}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-bold border-2 transition-all shadow-sm ${
                                            assigned.includes(c) && selectedCandidate !== c ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' :
                                            selectedCandidate === c ? 'bg-indigo-600 text-white border-indigo-700 scale-105 shadow-md' : 'bg-white text-slate-700 border-slate-300 hover:border-indigo-400'
                                        }`}>{c}</button>
                                ))}
                            </div>
                            <p className="text-center text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">2. Tap Role to Assign</p>
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                {puzzle.roles.map(r => {
                                    const isLocked = history.length > 0 && history[history.length-1].evaluation[puzzle.roles.indexOf(r)] === 'correct';
                                    return (
                                        <button key={r} onClick={() => !isLocked && handleAssign(r)} disabled={isLocked}
                                            className={`p-2 rounded-xl border-2 flex flex-col items-center justify-center h-16 transition-all ${
                                                isLocked ? 'bg-emerald-50 border-emerald-200 text-emerald-700' :
                                                currentGuess[r] ? 'bg-indigo-50 border-indigo-300 text-indigo-700 shadow-inner' :
                                                selectedCandidate ? 'border-dashed border-indigo-400 bg-indigo-50/50 animate-pulse' : 'border-dashed border-slate-300 bg-slate-50'
                                            }`}>
                                            <span className="text-[10px] uppercase font-bold opacity-70 mb-1 leading-tight text-center">{r}</span>
                                            <span className="text-sm font-bold">{currentGuess[r]}</span>
                                        </button>
                                    )
                                })}
                            </div>
                            <button onClick={handleSubmit} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold active:scale-95 transition-transform shadow-lg">Submit ({history.length}/{maxAttempts})</button>
                        </div>
                    )}
                </div>
            );
        };

        const WordleGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const targetWord = puzzle.word;
            const wordLen = targetWord.length;
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);

            const onKeyPress = useCallback((key) => {
                if (status !== 'playing') return;
                const safeGuess = typeof currentGuess === 'string' ? currentGuess : '';
                if (key === 'ENTER') {
                    if (safeGuess.length !== wordLen) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                    const evaluation = evaluateAttempt(safeGuess.split(''), targetWord.split(''));
                    const newHistory = [...history, { guess: safeGuess, evaluation }];
                    let newStatus = 'playing';
                    if (safeGuess === targetWord) newStatus = 'won';
                    else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                    setGameState({ history: newHistory, currentGuess: '', status: newStatus });
                    if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
                } else if (key === 'BACKSPACE') { setGameState(prev => ({ ...prev, currentGuess: (typeof prev.currentGuess === 'string' ? prev.currentGuess : '').slice(0, -1) })); } 
                else if (safeGuess.length < wordLen && /^[A-Z]$/.test(key)) { setGameState(prev => ({ ...prev, currentGuess: (typeof prev.currentGuess === 'string' ? prev.currentGuess : '') + key })); }
            }, [currentGuess, history, status, wordLen]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key === 'Enter') onKeyPress('ENTER');
                    else if (e.key === 'Backspace') onKeyPress('BACKSPACE');
                    else { const char = e.key.toUpperCase(); if (/^[A-Z]$/.test(char)) onKeyPress(char); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onKeyPress]);

            const keyColors = {};
            history.forEach((attempt) => {
                attempt.guess.split('').forEach((letter, i) => {
                    const evalState = attempt.evaluation[i];
                    if (evalState === 'correct') keyColors[letter] = 'bg-correct';
                    else if (evalState === 'present' && keyColors[letter] !== 'bg-correct') keyColors[letter] = 'bg-present';
                    else if (evalState === 'absent' && !keyColors[letter]) keyColors[letter] = 'bg-absent';
                });
            });

            const keys = [['Q','W','E','R','T','Y','U','I','O','P'], ['A','S','D','F','G','H','J','K','L'], ['ENTER','Z','X','C','V','B','N','M','BACKSPACE']];
            const safeGuess = typeof currentGuess === 'string' ? currentGuess : '';

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Definition</span>
                        <p className="text-slate-800 font-semibold mt-1 text-sm md:text-base">"{puzzle.clue}"</p>
                    </div>
                    <div className="flex-1 flex flex-col justify-center gap-1.5 mb-6 max-w-sm mx-auto w-full">
                        {[...Array(maxAttempts)].map((_, rIdx) => {
                            const attempt = history[rIdx];
                            const isActive = rIdx === history.length && status === 'playing';
                            const wordTiles = attempt ? attempt.guess.split('') : (isActive ? safeGuess.padEnd(wordLen, ' ').split('') : Array(wordLen).fill(''));
                            return (
                                <div key={rIdx} className={`flex gap-1.5 justify-center ${isActive && isShaking ? 'animate-shake' : ''}`}>
                                    {wordTiles.map((char, cIdx) => {
                                        const state = attempt ? attempt.evaluation[cIdx] : (char !== ' ' && char !== '' ? 'tbd' : 'empty');
                                        return (
                                            <div key={cIdx} className={`w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded text-2xl font-bold border-2 transition-all duration-500 uppercase
                                                ${state === 'empty' ? 'bg-transparent border-slate-200' : ''}
                                                ${state === 'tbd' ? 'bg-transparent border-slate-400 text-slate-800 animate-pop' : ''}
                                                ${state === 'correct' ? 'bg-correct animate-flip' : ''}
                                                ${state === 'present' ? 'bg-present animate-flip' : ''}
                                                ${state === 'absent' ? 'bg-absent animate-flip' : ''}
                                            `} style={{ animationDelay: attempt ? `${cIdx * 0.15}s` : '0s' }}>{char}</div>
                                        )
                                    })}
                                </div>
                            )
                        })}
                    </div>
                    <div className="mt-auto px-1 max-w-lg mx-auto w-full pb-4">
                        {keys.map((row, rIdx) => (
                            <div key={rIdx} className="flex justify-center gap-1 mb-1.5">
                                {row.map(key => {
                                    const isSpecial = key.length > 1;
                                    return (
                                        <button key={key} onClick={() => onKeyPress(key)}
                                            className={`h-12 md:h-14 rounded font-bold text-xs flex items-center justify-center transition-colors shadow-sm
                                            ${isSpecial ? 'px-2 md:px-4 bg-slate-300 text-slate-700' : 'flex-1 max-w-[38px] bg-slate-200 text-slate-800'}
                                            ${keyColors[key] || ''} active:scale-95`}
                                        >
                                            {key === 'BACKSPACE' ? <Icon name="delete" className="w-5 h-5" /> : key === 'ENTER' ? 'ENT' : key}
                                        </button>
                                    )
                                })}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SequenceGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);
            const guessArr = Array.isArray(currentGuess) ? currentGuess : [];
            const stepLen = puzzle.steps.length;

            const handleToggleStep = (stepId) => {
                if (status !== 'playing') return;
                if (guessArr.includes(stepId)) setGameState(prev => ({ ...prev, currentGuess: guessArr.filter(id => id !== stepId) }));
                else if (guessArr.length < stepLen) setGameState(prev => ({ ...prev, currentGuess: [...guessArr, stepId] }));
            };

            const handleSubmit = () => {
                if (guessArr.length !== stepLen) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                const evaluation = evaluateAttempt(guessArr, puzzle.solution);
                const newHistory = [...history, { guess: [...guessArr], evaluation }];
                let newStatus = 'playing';
                if (evaluation.every(e => e === 'correct')) newStatus = 'won';
                else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                setGameState({ history: newHistory, currentGuess: [], status: newStatus });
                if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
            };

            const getStepText = (id) => puzzle.steps.find(s => s.id === id)?.text || '';

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">{puzzle.title}</span>
                        <p className="text-slate-800 font-semibold mt-1 text-sm">{puzzle.desc}</p>
                    </div>
                    <div className="flex flex-col items-center gap-1 mb-4">
                        {history.map((attempt, rIdx) => (
                            <div key={rIdx} className="flex gap-1">
                                {attempt.evaluation.map((ev, cIdx) => (
                                    <div key={cIdx} className={`w-8 h-8 rounded border flex items-center justify-center font-bold text-xs text-white ${ev === 'correct' ? 'bg-correct animate-flip' : ev === 'present' ? 'bg-present animate-flip' : 'bg-absent animate-flip'}`} style={{ animationDelay: `${cIdx * 0.15}s` }}>{attempt.guess[cIdx]}</div>
                                ))}
                            </div>
                        ))}
                    </div>
                    {status === 'playing' && (
                        <div className="mt-auto space-y-4 max-w-lg mx-auto w-full">
                            <div className={`flex flex-col gap-2 p-3 bg-slate-100 rounded-xl border border-slate-200 min-h-[180px] ${isShaking ? 'animate-shake' : ''}`}>
                                <p className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Your Sequence</p>
                                {guessArr.map((id, idx) => (
                                    <div key={idx} onClick={() => handleToggleStep(id)} className="p-3 bg-white border border-indigo-300 rounded shadow-sm text-sm font-semibold flex items-center gap-3 cursor-pointer hover:bg-rose-50 transition-colors animate-pop">
                                        <span className="w-6 h-6 rounded bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs shrink-0">{idx + 1}</span>
                                        <span className="flex-1">{getStepText(id)}</span>
                                    </div>
                                ))}
                                {guessArr.length === 0 && <p className="text-slate-400 text-sm text-center py-6">Tap steps below to build sequence</p>}
                            </div>
                            <div className="grid grid-cols-1 gap-2">
                                {puzzle.steps.map(step => {
                                    if (guessArr.includes(step.id)) return null;
                                    return (
                                        <button key={step.id} onClick={() => handleToggleStep(step.id)} className="p-3 bg-white border border-slate-300 hover:border-indigo-400 rounded shadow-sm text-sm font-medium text-left flex items-center gap-3 active:scale-[0.98]">
                                            <span className="w-6 h-6 rounded bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold shrink-0">{step.id}</span>
                                            {step.text}
                                        </button>
                                    )
                                })}
                            </div>
                            <button onClick={handleSubmit} disabled={guessArr.length !== stepLen} className={`w-full py-4 rounded-xl font-bold transition-all shadow-md flex justify-center gap-2 ${guessArr.length === stepLen ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                Evaluate Sequence ({history.length}/{maxAttempts})
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const SynergyGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver, triggerToast }) => {
            const { history, currentGuess, status } = gameState;
            const [isShaking, setIsShaking] = useState(false);
            
            const board = currentGuess?.board || [];
            const selected = currentGuess?.selected || [];
            const solved = currentGuess?.solved || [];
            const mistakes = history.length;

            const handleToggle = (item) => {
                if (status !== 'playing') return;
                let newSelected = [...selected];
                if (newSelected.includes(item)) newSelected = newSelected.filter(i => i !== item);
                else if (newSelected.length < 4) newSelected.push(item);
                setGameState(prev => ({ ...prev, currentGuess: { ...prev.currentGuess, selected: newSelected } }));
            };

            const handleSubmit = () => {
                if (selected.length !== 4) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                
                // Find matching category
                const match = puzzle.categories.find(cat => selected.every(item => cat.items.includes(item)));
                
                if (match) {
                    const newSolved = [...solved, match];
                    const newBoard = board.filter(item => !selected.includes(item));
                    
                    if (newSolved.length === 4) {
                        setGameState(prev => ({ ...prev, currentGuess: { board: newBoard, selected: [], solved: newSolved }, status: 'won' }));
                        onGameOver('won', mistakes);
                    } else {
                        setGameState(prev => ({ ...prev, currentGuess: { board: newBoard, selected: [], solved: newSolved } }));
                        triggerToast("Great Synergy!");
                    }
                } else {
                    const isOneAway = puzzle.categories.some(cat => selected.filter(item => cat.items.includes(item)).length === 3);
                    if (isOneAway) triggerToast("One away!");
                    else { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); }
                    
                    const newHistory = [...history, selected];
                    if (newHistory.length >= maxAttempts) {
                        setGameState(prev => ({ ...prev, history: newHistory, currentGuess: { ...prev.currentGuess, selected: [] }, status: 'lost' }));
                        onGameOver('lost', newHistory.length);
                    } else {
                        setGameState(prev => ({ ...prev, history: newHistory, currentGuess: { ...prev.currentGuess, selected: [] } }));
                    }
                }
            };

            const renderDots = () => {
                return (
                    <div className="flex justify-center gap-2 mb-6">
                        <span className="text-sm font-bold text-slate-500 mr-2">Mistakes remaining:</span>
                        {[...Array(maxAttempts - mistakes)].map((_, i) => (
                            <div key={i} className="w-4 h-4 rounded-full bg-slate-400"></div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full animate-fade-in max-w-lg mx-auto w-full">
                    <p className="text-center font-medium text-slate-600 mb-6">Create 4 groups of 4 related concepts.</p>
                    
                    <div className="flex flex-col gap-2 mb-4">
                        {solved.map((cat, idx) => (
                            <div key={idx} className={`${cat.bg} rounded-xl p-4 text-center animate-pop shadow-sm`}>
                                <div className={`font-bold text-sm mb-1 ${cat.text}`}>{cat.title}</div>
                                <div className={`text-xs ${cat.text}`}>{cat.items.join(", ")}</div>
                            </div>
                        ))}
                    </div>

                    {status === 'playing' ? (
                        <div className={`grid grid-cols-4 gap-2 mb-8 ${isShaking ? 'animate-shake' : ''}`}>
                            {board.map((item, idx) => {
                                const isSelected = selected.includes(item);
                                return (
                                    <button 
                                        key={idx} onClick={() => handleToggle(item)}
                                        className={`aspect-square flex items-center justify-center rounded-xl p-2 text-xs md:text-sm font-bold transition-all break-words hyphens-auto shadow-sm
                                            ${isSelected ? 'bg-slate-800 text-white scale-95 shadow-inner' : 'bg-slate-100 text-slate-800 hover:bg-slate-200'}
                                        `}
                                    >
                                        {item}
                                    </button>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="grid grid-cols-4 gap-2 mb-8 opacity-50">
                             {board.map((item, idx) => (
                                <div key={idx} className="aspect-square flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 p-2 text-xs md:text-sm font-bold">
                                    {item}
                                </div>
                             ))}
                        </div>
                    )}

                    {status === 'playing' && (
                        <div className="mt-auto">
                            {renderDots()}
                            <div className="flex gap-2">
                                <button onClick={() => setGameState(prev => ({...prev, currentGuess: { ...prev.currentGuess, selected: [] }}))} className="flex-1 py-4 rounded-full font-bold bg-white border border-slate-300 text-slate-600 shadow-sm active:scale-95 transition-transform">Deselect</button>
                                <button onClick={handleSubmit} disabled={selected.length !== 4} className={`flex-1 py-4 rounded-full font-bold shadow-md transition-all ${selected.length === 4 ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>Submit</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CrosswordGame = ({ puzzle, maxAttempts, gameState, setGameState, onGameOver }) => {
            const { target, across, down, size } = puzzle;
            const { history, currentGuess, status } = gameState;
            const [activeCell, setActiveCell] = useState(0);
            const [direction, setDirection] = useState('across'); // 'across' or 'down'
            const [isShaking, setIsShaking] = useState(false);

            const grid = Array.isArray(currentGuess) ? currentGuess : Array(16).fill('');

            // Calculate Clue Numbers mapping
            const clueNumbers = {};
            [...across, ...down].forEach(c => clueNumbers[c.idx] = c.num);

            const getActiveWordIndices = () => {
                let indices = [];
                if (direction === 'across') {
                    const rowStart = Math.floor(activeCell / size) * size;
                    for (let i = 0; i < size; i++) indices.push(rowStart + i);
                } else {
                    const colStart = activeCell % size;
                    for (let i = 0; i < size; i++) indices.push(colStart + i * size);
                }
                return indices;
            };

            const activeIndices = getActiveWordIndices();
            
            const handleCellClick = (idx) => {
                if (status !== 'playing') return;
                if (activeCell === idx) setDirection(prev => prev === 'across' ? 'down' : 'across');
                else setActiveCell(idx);
            };

            const onKeyDown = useCallback((e) => {
                if (status !== 'playing') return;
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                
                const key = e.key.toUpperCase();
                
                if (/^[A-Z]$/.test(key) && key.length === 1) {
                    const newGrid = [...grid];
                    newGrid[activeCell] = key;
                    setGameState(prev => ({...prev, currentGuess: newGrid}));
                    
                    // Advance
                    if (direction === 'across' && (activeCell + 1) % size !== 0) setActiveCell(activeCell + 1);
                    else if (direction === 'down' && activeCell + size < size * size) setActiveCell(activeCell + size);
                } 
                else if (e.key === 'Backspace') {
                    if (grid[activeCell] !== '') {
                        const newGrid = [...grid];
                        newGrid[activeCell] = '';
                        setGameState(prev => ({...prev, currentGuess: newGrid}));
                    } else {
                        // Step back
                        if (direction === 'across' && activeCell % size !== 0) setActiveCell(activeCell - 1);
                        else if (direction === 'down' && activeCell - size >= 0) setActiveCell(activeCell - size);
                    }
                }
                else if (e.key === 'ArrowRight' && (activeCell + 1) % size !== 0) setActiveCell(activeCell + 1);
                else if (e.key === 'ArrowLeft' && activeCell % size !== 0) setActiveCell(activeCell - 1);
                else if (e.key === 'ArrowDown' && activeCell + size < size * size) setActiveCell(activeCell + size);
                else if (e.key === 'ArrowUp' && activeCell - size >= 0) setActiveCell(activeCell - size);
                else if (e.key === 'Tab' || e.key === ' ') { e.preventDefault(); setDirection(prev => prev === 'across' ? 'down' : 'across'); }
            }, [activeCell, direction, grid, status, size, setGameState]);

            // Setup global key listener to catch inputs
            useEffect(() => {
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [onKeyDown]);

            const handleSubmit = () => {
                if (grid.includes('')) { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); return; }
                
                const evaluation = grid.map((char, i) => char === target[i] ? 'correct' : 'absent');
                const newHistory = [...history, { guess: [...grid], evaluation }];
                
                let newStatus = 'playing';
                if (evaluation.every(e => e === 'correct')) newStatus = 'won';
                else if (newHistory.length >= maxAttempts) newStatus = 'lost';
                
                setGameState(prev => ({ ...prev, history: newHistory, status: newStatus }));
                if (newStatus !== 'playing') onGameOver(newStatus, newHistory.length);
                else { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); }
            };

            const getActiveClue = () => {
                const arr = direction === 'across' ? across : down;
                const startIdx = direction === 'across' ? Math.floor(activeCell / size) * size : activeCell % size;
                const clueObj = arr.find(c => c.idx === startIdx);
                return clueObj ? `${clueObj.num} ${direction.toUpperCase()}: ${clueObj.clue}` : '';
            };

            // Derive cell colors based on the latest history attempt
            const cellColors = Array(16).fill('bg-white');
            if (history.length > 0) {
                const latestEval = history[history.length - 1].evaluation;
                latestEval.forEach((ev, i) => { if (ev === 'absent') cellColors[i] = 'bg-rose-100 text-rose-700'; });
            }

            return (
                <div className="flex flex-col h-full animate-fade-in max-w-sm mx-auto w-full">
                    <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-xl mb-6 shadow-sm min-h-[80px] flex items-center justify-center">
                        <p className="text-sm font-bold text-indigo-900 text-center">{getActiveClue()}</p>
                    </div>

                    <div className={`grid grid-cols-4 gap-1 mx-auto mb-8 bg-slate-800 p-1 rounded-lg ${isShaking ? 'animate-shake' : ''}`} style={{ width: 'fit-content' }}>
                        {grid.map((char, idx) => {
                            const isFocused = activeCell === idx && status === 'playing';
                            const isHighlighted = activeIndices.includes(idx) && status === 'playing';
                            const isCorrect = status === 'won';
                            
                            return (
                                <div 
                                    key={idx} 
                                    onClick={() => handleCellClick(idx)}
                                    className={`relative w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center text-2xl font-bold uppercase cursor-pointer rounded-sm transition-colors duration-200
                                        ${isCorrect ? 'bg-correct' : isFocused ? 'bg-amber-200' : isHighlighted ? 'bg-amber-50' : cellColors[idx]}
                                    `}
                                >
                                    {clueNumbers[idx] && <span className="absolute top-1 left-1.5 text-[9px] font-bold text-slate-500 leading-none">{clueNumbers[idx]}</span>}
                                    {char}
                                </div>
                            )
                        })}
                    </div>

                    <div className="mt-auto">
                        <div className="flex justify-center gap-2 mb-4">
                            {history.map((_, i) => <div key={i} className="w-3 h-3 rounded-full bg-rose-500 animate-pop"></div>)}
                            {[...Array(maxAttempts - history.length)].map((_, i) => <div key={`e-${i}`} className="w-3 h-3 rounded-full bg-slate-200"></div>)}
                        </div>
                        <button onClick={handleSubmit} disabled={status !== 'playing'} className={`w-full py-4 rounded-xl font-bold transition-all shadow-md flex justify-center gap-2 ${status === 'playing' ? 'bg-slate-900 text-white active:scale-95' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                            Check Puzzle
                        </button>
                    </div>
                </div>
            );
        };

        const FeedbackForm = () => {
            const [rating, setRating] = useState(0);
            const [hovered, setHovered] = useState(0);
            const [comment, setComment] = useState('');
            const [submitted, setSubmitted] = useState(false);

            if (submitted) {
                return (
                    <div className="mt-4 p-4 bg-emerald-50 border border-emerald-100 rounded-xl text-center animate-fade-in" data-html2canvas-ignore>
                        <Icon name="check-circle-2" className="w-6 h-6 text-emerald-500 mx-auto mb-2" />
                        <p className="text-sm font-bold text-emerald-800">Terima kasih atas masukannya!</p>
                        <p className="text-xs text-emerald-600 mt-1">Saran Anda membantu kami berkembang.</p>
                    </div>
                );
            }

            return (
                <div className="mt-4 pt-4 border-t border-slate-100 animate-fade-in" data-html2canvas-ignore>
                    <p className="text-xs font-bold text-slate-400 uppercase text-center mb-2">Rate Today's Game</p>
                    <div className="flex justify-center gap-1 mb-3">
                        {[1, 2, 3, 4, 5].map(star => (
                            <button 
                                key={star}
                                onMouseEnter={() => setHovered(star)}
                                onMouseLeave={() => setHovered(0)}
                                onClick={() => setRating(star)}
                                className="p-1 transition-transform hover:scale-110 focus:outline-none"
                            >
                                <Icon 
                                    name={(hovered || rating) >= star ? 'star-filled' : 'star'} 
                                    className={`w-7 h-7 ${((hovered || rating) >= star) ? 'text-amber-400' : 'text-slate-200'}`} 
                                />
                            </button>
                        ))}
                    </div>
                    {rating > 0 && (
                        <div className="flex flex-col gap-2 animate-slide-down">
                            <textarea 
                                value={comment}
                                onChange={(e) => setComment(e.target.value)}
                                placeholder="Punya saran untuk game hari ini? (Opsional)"
                                className="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-indigo-500 focus:bg-white transition-colors resize-none h-20"
                            />
                            <button 
                                onClick={() => setSubmitted(true)}
                                className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold active:scale-95 transition-transform"
                            >
                                Kirim Feedback
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const AuthModal = ({ isVisible, onClose, onLogin }) => {
            const [isLoading, setIsLoading] = useState(false);

            if (!isVisible) return null;

            const handleLogin = async () => {
                setIsLoading(true);
                try {
                    const user = await CloudDB.loginWithGoogle();
                    onLogin(user);
                    onClose();
                } catch (e) {
                    console.error("Login Failed", e);
                }
                setIsLoading(false);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-pop text-center">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><Icon name="x" className="w-5 h-5" /></button>
                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Icon name="user" className="w-8 h-8 text-slate-400" />
                        </div>
                        <h2 className="text-xl font-bold mb-2">Track Global Ranking</h2>
                        <p className="text-sm text-slate-600 mb-6">Sign in to sync your scores to the cloud and compete on the global leaderboard.</p>
                        
                        <button 
                            onClick={handleLogin}
                            disabled={isLoading}
                            className="w-full flex items-center justify-center gap-3 py-3 border-2 border-slate-200 rounded-xl font-bold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm active:scale-95 disabled:opacity-50"
                        >
                            {isLoading ? (
                                <span className="animate-pulse">Connecting...</span>
                            ) : (
                                <>
                                    <Icon name="google" className="w-5 h-5" />
                                    Continue with Google
                                </>
                            )}
                        </button>
                        <p className="text-[10px] text-slate-400 mt-4 px-4">This is a secure connection. Your local stats will not be lost.</p>
                    </div>
                </div>
            );
        }

        const Modals = ({ showHelp, setShowHelp, showStats, setShowStats, stats, timeToMidnight, handleShare, gameType, gameStatus, puzzle, shareImage, setShareImage, isCapturing, downloadImage, shareToApps, currentUser, onOpenAuth, dayIndex }) => {
            const GameTitle = gameType.replace('_', ' ');
            const [activeTab, setActiveTab] = useState('personal'); 
            const [leaderboard, setLeaderboard] = useState([]);
            const [loadingLeaderboard, setLoadingLeaderboard] = useState(false);

            useEffect(() => {
                let isMounted = true;
                if (showStats && activeTab === 'global') {
                    setLoadingLeaderboard(true);
                    CloudDB.getLeaderboard(gameType, dayIndex).then(data => {
                        if (isMounted) {
                            setLeaderboard(data);
                            setLoadingLeaderboard(false);
                        }
                    });
                }
                return () => { isMounted = false; };
            }, [showStats, activeTab, gameType, dayIndex]);

            const getInstructions = (type) => {
                switch(type) {
                    case 'TALENT_GRID': return "Act as a Recruiter. Read the clues to match 4 candidates to their perfect roles. Watch out for the 'Red Flag' candidate who doesn't fit anywhere!";
                    case 'JARGON_BUSTER': return "Guess the 5-letter corporate buzzword based on the definition. Green = correct letter & spot. Yellow = right letter, wrong spot.";
                    case 'PROCESS_FLOW': return "Standard Operating Procedures matter! Tap the steps to sequence them in the correct chronological order.";
                    case 'SYNERGY_SQUARE': return "Find groups of 4 items that share a common corporate theme. Select 4 tiles and tap 'Submit' to see if you have the right connection!";
                    case 'MINI_CROSSWORD': return "Solve the micro 4x4 corporate crossword. Tap a cell to type, use arrow keys to navigate, or tap spacebar to switch between Across and Down clues. Hit 'Check' when full!";
                    default: return "Solve the daily logic puzzle before you run out of attempts.";
                }
            };
            
            return (
                <>
                    {showHelp && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl relative animate-slide-down">
                                <button onClick={() => setShowHelp(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><Icon name="x" className="w-5 h-5" /></button>
                                <h2 className="text-xl font-bold mb-1">How to Play</h2>
                                <h3 className="text-sm font-semibold text-indigo-600 mb-4">{GameTitle}</h3>
                                <p className="text-sm text-slate-600 mb-6 leading-relaxed">
                                    {getInstructions(gameType)}
                                </p>
                                <button onClick={() => setShowHelp(false)} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold mt-2">Let's Play</button>
                            </div>
                        </div>
                    )}

                    {showStats && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl relative animate-slide-down my-auto overflow-hidden">
                                <button data-html2canvas-ignore onClick={() => {setShowStats(false); setShareImage(null);}} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 z-10"><Icon name="x" className="w-5 h-5" /></button>
                                
                                <div className="flex bg-slate-50 border-b border-slate-200" data-html2canvas-ignore>
                                    <button onClick={() => setActiveTab('personal')} className={`flex-1 py-3 text-xs font-bold transition-colors ${activeTab === 'personal' ? 'text-indigo-700 bg-white border-b-2 border-indigo-600' : 'text-slate-500'}`}>My Stats</button>
                                    <button onClick={() => setActiveTab('global')} className={`flex-1 py-3 text-xs font-bold transition-colors flex items-center justify-center gap-1 ${activeTab === 'global' ? 'text-indigo-700 bg-white border-b-2 border-indigo-600' : 'text-slate-500'}`}>
                                        <Icon name="trophy" className="w-3 h-3" /> Global
                                    </button>
                                </div>

                                {activeTab === 'personal' && (
                                    <>
                                        <div id="capture-node" className="p-6 bg-white relative">
                                            <div className="text-center mb-6 border-b border-slate-100 pb-4">
                                                <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">CorpQuest</h1>
                                                <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">{GameTitle}</p>
                                            </div>

                                            {gameStatus !== 'playing' && (
                                                <div className="mb-6 border-b border-slate-100 pb-6 text-center">
                                                    <div className="text-5xl mb-3">{gameStatus === 'won' ? '🏆' : '📉'}</div>
                                                    <h2 className="text-2xl font-bold text-slate-900 mb-1">{gameStatus === 'won' ? 'Excellent Work!' : 'Tough Luck.'}</h2>
                                                    {gameStatus === 'won' && (
                                                        <div className="text-sm font-bold text-emerald-600 bg-emerald-50 py-1 px-3 rounded-full inline-block mt-2 border border-emerald-100 shadow-sm">
                                                            Score: {stats.lastScore || 0} pts
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {gameStatus === 'won' && puzzle?.trivia && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-left shadow-sm">
                                                    <h4 className="flex items-center gap-2 text-amber-800 font-bold mb-2"><Icon name="lightbulb" className="w-5 h-5" /> Fun Fact</h4>
                                                    <p className="text-sm text-amber-900 leading-relaxed font-medium">{puzzle.trivia}</p>
                                                </div>
                                            )}

                                            <h3 className="text-sm font-bold uppercase text-slate-400 mb-4 text-center">{GameTitle} Stats</h3>
                                            <div className="grid grid-cols-4 gap-2 text-center">
                                                <div className="flex flex-col"><span className="text-xl font-bold">{stats.played}</span><span className="text-[10px] uppercase text-slate-500">Played</span></div>
                                                <div className="flex flex-col"><span className="text-xl font-bold">{stats.played > 0 ? Math.round((stats.wins/stats.played)*100) : 0}</span><span className="text-[10px] uppercase text-slate-500">Win %</span></div>
                                                <div className="flex flex-col"><span className="text-xl font-bold">{stats.currentStreak}</span><span className="text-[10px] uppercase text-slate-500">Streak</span></div>
                                                <div className="flex flex-col"><span className="text-xl font-bold">{stats.maxStreak}</span><span className="text-[10px] uppercase text-slate-500">Max</span></div>
                                            </div>
                                        </div>

                                        {gameStatus !== 'playing' && (
                                            <div data-html2canvas-ignore className="p-6 pt-0 bg-white">
                                                {shareImage ? (
                                                    <div className="flex flex-col gap-3 animate-fade-in">
                                                        <div className="text-center text-xs font-bold text-slate-400 uppercase">Preview Share</div>
                                                        <img src={shareImage} className="w-48 mx-auto rounded-lg border-2 border-slate-200 shadow-md mb-2" alt="Screenshot Result" />
                                                        <div className="flex gap-2">
                                                            <button onClick={downloadImage} className="flex-1 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl py-3 font-bold text-sm transition-colors flex items-center justify-center gap-2 shadow-sm">
                                                                <Icon name="download" className="w-4 h-4" /> Save Image
                                                            </button>
                                                            <button onClick={shareToApps} className="flex-1 bg-gradient-to-tr from-pink-500 to-orange-400 text-white hover:opacity-90 rounded-xl py-3 font-bold text-sm transition-opacity shadow-md flex items-center justify-center gap-2">
                                                                <Icon name="instagram" className="w-4 h-4" /> IG Story
                                                            </button>
                                                        </div>
                                                        <button onClick={() => setShareImage(null)} className="w-full text-xs text-slate-500 mt-2 font-bold py-2 hover:text-slate-800">Batalkan</button>
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col">
                                                        <div className="flex gap-3">
                                                            <div className="flex-1 bg-slate-100 rounded-xl p-3 text-center border border-slate-200">
                                                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Next Puzzle</p>
                                                                <p className="text-lg font-mono font-bold text-slate-800">{timeToMidnight}</p>
                                                            </div>
                                                            <button onClick={handleShare} disabled={isCapturing} className="flex-1 bg-indigo-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition-colors shadow-md">
                                                                {isCapturing ? 'Capturing...' : <><Icon name="camera" className="w-4 h-4" /> Screenshot</>}
                                                            </button>
                                                        </div>
                                                        <FeedbackForm />
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}

                                {activeTab === 'global' && (
                                    <div className="p-6 bg-white min-h-[400px]">
                                        {!currentUser ? (
                                            <div className="text-center pt-8">
                                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                                    <Icon name="trophy" className="w-8 h-8 text-amber-400" />
                                                </div>
                                                <h3 className="font-bold text-lg mb-2">Global Leaderboard</h3>
                                                <p className="text-sm text-slate-500 mb-6">Sign in to see how you stack up against other corporate warriors.</p>
                                                <button onClick={onOpenAuth} className="bg-slate-900 text-white px-6 py-2.5 rounded-full font-bold shadow-md hover:bg-slate-800 active:scale-95 transition-all">Sign In to View</button>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="text-center mb-6">
                                                    <h3 className="font-bold text-lg">{GameTitle} Today</h3>
                                                    <p className="text-xs text-slate-500">Ranked by Score & Speed</p>
                                                </div>
                                                {loadingLeaderboard ? (
                                                    <div className="text-center text-slate-400 py-10 animate-pulse">Loading scores...</div>
                                                ) : (
                                                    <div className="space-y-2">
                                                        {leaderboard.map((user, idx) => (
                                                            <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl border ${user.isMe ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white border-slate-100'}`}>
                                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-amber-100 text-amber-600' : idx === 1 ? 'bg-slate-200 text-slate-600' : idx === 2 ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-400'}`}>
                                                                    {idx + 1}
                                                                </div>
                                                                <div className="flex-1">
                                                                    <div className="text-sm font-bold flex items-center gap-1 text-slate-800">
                                                                        {user.name} {user.isMe && <span className="text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded ml-1">YOU</span>}
                                                                    </div>
                                                                    <div className="text-[10px] text-slate-500">{user.time}s</div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="text-sm font-bold text-indigo-600">{user.score}</div>
                                                                    <div className="text-[10px] text-slate-400 uppercase">PTS</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {leaderboard.length === 0 && <p className="text-center text-sm text-slate-400 py-4">No scores yet today.</p>}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            )
        };

        const AdminPanel = ({ isVisible, onClose, currentDayIndex }) => {
            const [activeTab, setActiveTab] = useState(0); 
            if (!isVisible) return null;

            const tabs = [{ id: -1, label: 'Yesterday' }, { id: 0, label: 'Today' }, { id: 1, label: 'Tomorrow' }];
            const activeData = getPuzzleDataForIndex(currentDayIndex + activeTab);

            const renderSolution = () => {
                if (!activeData) return <div className="p-8 text-center text-slate-500">No puzzle scheduled.</div>;
                const { gameType, puzzleData } = activeData;

                if (gameType === 'TALENT_GRID') {
                    const distractor = puzzleData.candidates.find(c => !Object.values(puzzleData.solution).includes(c));
                    return (
                        <div className="space-y-4 animate-slide-down">
                            <div className="grid grid-cols-1 gap-2">
                                {Object.entries(puzzleData.solution).map(([role, person]) => (
                                    <div key={role} className="flex justify-between items-center bg-emerald-50 p-2.5 rounded-lg border border-emerald-100"><span className="text-xs font-semibold text-slate-700">{role}</span><span className="text-sm font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">{person}</span></div>
                                ))}
                            </div>
                            <div className="bg-rose-50 border border-rose-100 p-3 rounded-lg flex justify-between"><span className="text-[10px] font-bold text-rose-500 uppercase">Red Flag</span><span className="text-sm font-bold text-rose-700">{distractor}</span></div>
                        </div>
                    );
                }
                if (gameType === 'JARGON_BUSTER') return (<div className="text-center p-4"><p className="text-sm italic mb-4">"{puzzleData.clue}"</p><p className="text-3xl font-bold tracking-[0.2em] text-emerald-600">{puzzleData.word}</p></div>);
                if (gameType === 'PROCESS_FLOW') return (
                    <div className="space-y-2">
                        {puzzleData.solution.map((stepId, idx) => (
                            <div key={stepId} className="flex gap-3 items-center bg-emerald-50 p-3 rounded-lg border border-emerald-100"><span className="w-6 h-6 rounded bg-emerald-200 text-emerald-800 flex items-center justify-center text-xs font-bold">{idx + 1}</span><span className="text-xs font-semibold text-emerald-900">{puzzleData.steps.find(s => s.id === stepId).text}</span></div>
                        ))}
                    </div>
                );
                if (gameType === 'SYNERGY_SQUARE') return (
                    <div className="flex flex-col gap-2">
                        {puzzleData.categories.map((cat, i) => (
                            <div key={i} className="p-3 bg-emerald-50 border border-emerald-100 rounded-lg text-center">
                                <p className="text-xs font-bold text-emerald-700 uppercase mb-1">{cat.title}</p>
                                <p className="text-sm font-medium text-emerald-900">{cat.items.join(', ')}</p>
                            </div>
                        ))}
                    </div>
                );
                if (gameType === 'MINI_CROSSWORD') return (
                    <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-center">
                        <p className="text-xs text-emerald-600 font-bold uppercase mb-2">Completed Grid String</p>
                        <p className="text-lg font-mono font-bold tracking-widest text-emerald-900 break-all">{puzzleData.target}</p>
                    </div>
                );
                
                return null;
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl relative flex flex-col max-h-[85vh] overflow-hidden">
                        <div className="bg-slate-900 p-5 flex justify-between items-center text-white">
                            <div className="flex items-center gap-3">
                                <Icon name="shield" className="w-5 h-5 text-indigo-400" />
                                <div><h2 className="font-bold leading-tight">Admin Portal</h2><p className="text-[10px] text-slate-400 font-medium tracking-wide">PUZZLE DATA PREVIEW</p></div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <div className="flex p-2 bg-slate-50 border-b border-slate-200">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${activeTab === tab.id ? 'bg-white text-indigo-700 shadow border border-slate-100' : 'text-slate-500'}`}>{tab.label}</button>
                            ))}
                        </div>
                        <div className="p-6 overflow-y-auto hide-scrollbar flex-1 bg-white">
                            {activeData && (
                                <div className="mb-5 flex justify-between items-end border-b border-slate-100 pb-4">
                                    <div>
                                        <div className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-1">{activeData.gameType.replace('_', ' ')}</div>
                                        <div className="text-lg font-bold text-slate-800 leading-none">{activeData.dateStr}</div>
                                    </div>
                                    <div className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">Day #{activeData.dayIndex + 1}</div>
                                </div>
                            )}
                            {renderSolution()}
                        </div>
                    </div>
                </div>
            );
        };

        const DEFAULT_STATS = { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, lastScore: 0 };

        function App() {
            const params = getDayParams();
            const [gameState, setGameState] = useState({ history: [], currentGuess: null, status: 'playing' });
            const [allStats, setAllStats] = useState({});
            
            const [currentUser, setCurrentUser] = useState(null);
            const [gameStartTime, setGameStartTime] = useState(Date.now());
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfileMenu, setShowProfileMenu] = useState(false);

            const [showHelp, setShowHelp] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [showAdminAuth, setShowAdminAuth] = useState(false);
            const [adminPwd, setAdminPwd] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [timeToMidnight, setTimeToMidnight] = useState('00:00:00');
            const [toastMsg, setToastMsg] = useState('');
            const [shareImage, setShareImage] = useState(null);
            const [isCapturing, setIsCapturing] = useState(false);

            // Listen to Firebase Auth state automatically
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        setCurrentUser({ uid: user.uid, name: user.displayName || user.email.split('@')[0], email: user.email });
                    } else {
                        setCurrentUser(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const savedStats = JSON.parse(localStorage.getItem('corpQuestStats_v4')) || {};
                setAllStats(savedStats);

                const savedStateRaw = localStorage.getItem('corpQuestState_v4');
                let loadedState = false;
                
                if (savedStateRaw) {
                    try {
                        const parsed = JSON.parse(savedStateRaw);
                        if (parsed.date === params.todayStr && parsed.gameType === params.gameType) {
                            setGameState(parsed.gameState);
                            loadedState = true;
                        }
