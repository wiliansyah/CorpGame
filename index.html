                    } catch (e) {
                        console.error("Corrupt local storage data, starting fresh.");
                    }
                }
                
                if (!loadedState) {
                    let initialGuess = '';
                    if (params.gameType === 'TALENT_GRID') {
                        initialGuess = {}; params.puzzleData.roles.forEach(r => initialGuess[r] = '');
                    } else if (params.gameType === 'PROCESS_FLOW') {
                        initialGuess = [];
                    } else if (params.gameType === 'SYNERGY_SQUARE') {
                        // Shuffle items for the board based on the day's seed
                        const rng = seededRNG(params.rngSeed);
                        const allItems = params.puzzleData.categories.flatMap(c => c.items);
                        initialGuess = { board: shuffleArray(allItems, rng), selected: [], solved: [] };
                    } else if (params.gameType === 'MINI_CROSSWORD') {
                        initialGuess = Array(16).fill('');
                    }
                    
                    setGameState({ history: [], currentGuess: initialGuess, status: 'playing' });
                    setGameStartTime(Date.now()); 
                    if (!savedStats[params.gameType]) setShowHelp(true);
                }
            }, []);

            useEffect(() => {
                if (gameState.history.length > 0 || gameState.status !== 'playing') {
                    localStorage.setItem('corpQuestState_v4', JSON.stringify({
                        date: params.todayStr,
                        gameType: params.gameType,
                        gameState
                    }));
                }
            }, [gameState]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
                    const diff = midnight - now;
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    setTimeToMidnight(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
                    if (h === 0 && m === 0 && s === 0) window.location.reload();
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const triggerToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

            const handleGameOver = (status, attempts) => {
                const timeTakenSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
                const score = calculateScore(status === 'won', attempts, params.maxAttempts, timeTakenSeconds);

                const currentStats = allStats[params.gameType] || { ...DEFAULT_STATS };
                const newStats = { ...currentStats, played: currentStats.played + 1, lastScore: score };
                if (status === 'won') {
                    newStats.wins += 1;
                    newStats.currentStreak += 1;
                    newStats.maxStreak = Math.max(newStats.maxStreak, newStats.currentStreak);
                } else newStats.currentStreak = 0;

                const updatedAllStats = { ...allStats, [params.gameType]: newStats };
                setAllStats(updatedAllStats);
                localStorage.setItem('corpQuestStats_v4', JSON.stringify(updatedAllStats));
                
                if (auth.currentUser) {
                    CloudDB.saveScore(currentUser || { uid: auth.currentUser.uid, name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0] }, params.gameType, params.dayIndex, score, timeTakenSeconds);
                }

                setTimeout(() => setShowStats(true), 1500);
            };

            const submitAdminPwd = () => {
                if (adminPwd === ADMIN_PASSWORD) {
                    setShowAdminAuth(false); setAdminPwd(''); setShowAdmin(true);
                } else {
                    triggerToast("Password Salah!");
                }
            };

            const handleLogin = (user) => {
                triggerToast(`Welcome back, ${user.name}!`);
                if (gameState.status === 'won') {
                    const stats = allStats[params.gameType];
                    if (stats && stats.lastScore > 0) {
                        CloudDB.saveScore(user, params.gameType, params.dayIndex, stats.lastScore, 60); 
                    }
                }
            };

            const handleLogout = () => {
                auth.signOut().then(() => {
                    setShowProfileMenu(false);
                    triggerToast("Logged out successfully.");
                });
            };

            const handleShare = () => {
                setIsCapturing(true);
                
                setTimeout(async () => {
                    try {
                        if (!window.html2canvas) {
                            triggerToast("Sistem error: screenshot library belum termuat.");
                            setIsCapturing(false);
                            return;
                        }
                        
                        const element = document.getElementById('capture-node');
                        if (!element) throw new Error("Capture node not found");

                        const originalRadius = element.style.borderRadius;
                        element.style.borderRadius = '0px';
                        
                        const canvas = await window.html2canvas(element, {
                            scale: 2, 
                            backgroundColor: '#ffffff',
                            useCORS: true,
                            logging: false
                        });
                        
                        element.style.borderRadius = originalRadius; 
                        
                        const dataUrl = canvas.toDataURL('image/png');
                        setShareImage(dataUrl);
                    } catch (err) {
                        console.error("html2canvas error:", err);
                        triggerToast("Gagal mengambil screenshot.");
                    }
                    setIsCapturing(false);
                }, 150);
            };

            const downloadImage = () => {
                if (!shareImage) return;
                const a = document.createElement('a');
                a.href = shareImage;
                a.download = `CorpQuest-${params.todayStr}.png`;
                a.click();
            };

            const shareToApps = async () => {
                if (!shareImage) return;
                try {
                    const res = await fetch(shareImage);
                    const blob = await res.blob();
                    const file = new File([blob], `CorpQuest-${params.todayStr}.png`, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'My CorpQuest Result',
                            files: [file]
                        });
                    } else {
                        triggerToast("Browser ini tidak mendukung direct share. Silakan klik Save Image.");
                    }
                } catch (err) {
                    console.error(err);
                    triggerToast("Batal membagikan gambar.");
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col relative bg-slate-50 shadow-2xl overflow-hidden">
                    {gameState.status === 'won' && <Confetti />}
                    <Toast message={toastMsg} isVisible={!!toastMsg} />
                    
                    <header className="flex justify-between items-center p-4 border-b border-slate-200 bg-white sticky top-0 z-10">
                        <div className="flex-1 flex gap-1">
                            <button onClick={() => setShowAdminAuth(true)} className="p-2 text-slate-400 hover:text-indigo-600 transition rounded-full hover:bg-indigo-50"><Icon name="shield" className="w-5 h-5" /></button>
                            <button onClick={() => setShowHelp(true)} className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100"><Icon name="help-circle" className="w-5 h-5" /></button>
                        </div>
                        <div className="text-center shrink-0">
                            <h1 className="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">CorpQuest</h1>
                            <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">{params.gameType.replace('_', ' ')}</p>
                        </div>
                        <div className="flex-1 flex justify-end gap-1 relative">
                            <button onClick={() => setShowStats(true)} className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100 relative">
                                <Icon name="bar-chart-2" className="w-5 h-5" />
                                {gameState.status !== 'playing' && <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full"></span>}
                            </button>
                            <button onClick={() => currentUser ? setShowProfileMenu(!showProfileMenu) : setShowAuthModal(true)} className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100 relative">
                                <Icon name="user" className={`w-5 h-5 ${currentUser ? 'text-indigo-600' : ''}`} />
                                {!currentUser && <span className="absolute top-2 right-2 w-2 h-2 bg-amber-400 rounded-full border border-white"></span>}
                            </button>
                            
                            {/* Profile Dropdown */}
                            {showProfileMenu && currentUser && (
                                <div className="absolute top-full right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 p-2 animate-pop z-50">
                                    <div className="px-3 py-2 border-b border-slate-100 mb-2">
                                        <p className="text-xs font-bold text-slate-800 truncate">{currentUser.name}</p>
                                        <p className="text-[10px] text-emerald-500 font-semibold">Global Sync Active</p>
                                    </div>
                                    <button onClick={handleLogout} className="w-full text-left px-3 py-2 text-sm text-rose-600 font-semibold hover:bg-rose-50 rounded-lg flex items-center gap-2">
                                        <Icon name="log-out" className="w-4 h-4" /> Sign Out
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 p-4 flex flex-col overflow-y-auto hide-scrollbar relative z-0">
                        {params.gameType === 'TALENT_GRID' && <GridGame puzzle={params.puzzleData} maxAttempts={params.maxAttempts} gameState={gameState} setGameState={setGameState} onGameOver={handleGameOver} />}
                        {params.gameType === 'JARGON_BUSTER' && <WordleGame puzzle={params.puzzleData} maxAttempts={params.maxAttempts} gameState={gameState} setGameState={setGameState} onGameOver={handleGameOver} />}
                        {params.gameType === 'PROCESS_FLOW' && <SequenceGame puzzle={params.puzzleData} maxAttempts={params.maxAttempts} gameState={gameState} setGameState={setGameState} onGameOver={handleGameOver} />}
                        {params.gameType === 'SYNERGY_SQUARE' && <SynergyGame puzzle={params.puzzleData} maxAttempts={params.maxAttempts} gameState={gameState} setGameState={setGameState} onGameOver={handleGameOver} triggerToast={triggerToast} />}
                        {params.gameType === 'MINI_CROSSWORD' && <CrosswordGame puzzle={params.puzzleData} maxAttempts={params.maxAttempts} gameState={gameState} setGameState={setGameState} onGameOver={handleGameOver} />}
                    </main>

                    <AuthModal isVisible={showAuthModal} onClose={() => setShowAuthModal(false)} onLogin={handleLogin} />

                    <Modals showHelp={showHelp} setShowHelp={setShowHelp} showStats={showStats} setShowStats={setShowStats} stats={allStats[params.gameType] || DEFAULT_STATS} timeToMidnight={timeToMidnight} handleShare={handleShare} gameType={params.gameType} gameStatus={gameState.status} puzzle={params.puzzleData} shareImage={shareImage} setShareImage={setShareImage} isCapturing={isCapturing} downloadImage={downloadImage} shareToApps={shareToApps} currentUser={currentUser} onOpenAuth={() => { setShowStats(false); setShowAuthModal(true); }} dayIndex={params.dayIndex} />
                    
                    <AdminPanel isVisible={showAdmin} onClose={() => setShowAdmin(false)} currentDayIndex={params.dayIndex} />

                    {showAdminAuth && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-pop text-center">
                                <h3 className="font-bold text-lg mb-2">Admin Access</h3>
                                <p className="text-sm text-slate-500 mb-4">Masukkan password untuk melihat jawaban (Portal Admin).</p>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitAdminPwd()} className="w-full p-3 border border-slate-200 rounded-xl mb-4 text-center tracking-widest focus:outline-indigo-500" placeholder="••••••••" />
                                <div className="flex gap-2">
                                    <button onClick={() => {setShowAdminAuth(false); setAdminPwd('');}} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200">Batal</button>
                                    <button onClick={submitAdminPwd} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Masuk</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
