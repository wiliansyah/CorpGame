              (c) => !Object.values(puzzleData.solution).includes(c)
            );
            return (
              <div className="space-y-4 animate-slide-down">
                <div className="grid grid-cols-1 gap-2">
                  {Object.entries(puzzleData.solution).map(([role, person]) => (
                    <div
                      key={role}
                      className="flex justify-between items-center bg-emerald-50 p-2.5 rounded-lg border border-emerald-100"
                    >
                      <span className="text-xs font-semibold text-slate-700">
                        {role}
                      </span>
                      <span className="text-sm font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">
                        {person}
                      </span>
                    </div>
                  ))}
                </div>
                <div className="bg-rose-50 border border-rose-100 p-3 rounded-lg flex justify-between">
                  <span className="text-[10px] font-bold text-rose-500 uppercase">
                    Red Flag
                  </span>
                  <span className="text-sm font-bold text-rose-700">
                    {distractor}
                  </span>
                </div>
              </div>
            );
          }
          if (gameType === 'JARGON_BUSTER')
            return (
              <div className="text-center p-4">
                <p className="text-sm italic mb-4">"{puzzleData.clue}"</p>
                <p className="text-3xl font-bold tracking-[0.2em] text-emerald-600">
                  {puzzleData.word}
                </p>
              </div>
            );
          if (gameType === 'PROCESS_FLOW')
            return (
              <div className="space-y-2">
                {puzzleData.solution.map((stepId, idx) => (
                  <div
                    key={stepId}
                    className="flex gap-3 items-center bg-emerald-50 p-3 rounded-lg border border-emerald-100"
                  >
                    <span className="w-6 h-6 rounded bg-emerald-200 text-emerald-800 flex items-center justify-center text-xs font-bold">
                      {idx + 1}
                    </span>
                    <span className="text-xs font-semibold text-emerald-900">
                      {puzzleData.steps.find((s) => s.id === stepId).text}
                    </span>
                  </div>
                ))}
              </div>
            );
          if (gameType === 'ACRONYM_BUILDER' || gameType === 'EMAIL_CRAFT')
            return (
              <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-center">
                <p className="text-xs text-emerald-600 font-bold uppercase mb-2">
                  Target Phrase
                </p>
                <p className="text-lg font-bold text-emerald-900">
                  {puzzleData.target.join(' ')}
                </p>
              </div>
            );
          if (gameType === 'POLICY_SORTER' || gameType === 'BENEFIT_SORTER')
            return (
              <div className="grid grid-cols-2 gap-2">
                {[0, 1].map((catId) => (
                  <div
                    key={catId}
                    className="p-3 bg-emerald-50 border border-emerald-100 rounded-lg"
                  >
                    <p className="text-xs font-bold text-emerald-700 uppercase mb-2">
                      {puzzleData.categories[catId]}
                    </p>
                    <ul className="text-xs text-emerald-900 space-y-1 list-disc pl-3">
                      {puzzleData.items
                        .filter((i) => i.cat === catId)
                        .map((i, idx) => (
                          <li key={idx}>{i.text}</li>
                        ))}
                    </ul>
                  </div>
                ))}
              </div>
            );
          if (gameType === 'MEETING_MINDER')
            return (
              <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-center">
                <p className="text-xs text-emerald-600 font-bold uppercase mb-2">
                  Correct Time Slot
                </p>
                <p className="text-2xl font-bold text-emerald-900">
                  {puzzleData.slots[puzzleData.solution]}
                </p>
              </div>
            );

          return null;
        };

        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl relative flex flex-col max-h-[85vh] overflow-hidden">
              <div className="bg-slate-900 p-5 flex justify-between items-center text-white">
                <div className="flex items-center gap-3">
                  <i
                    data-lucide="shield"
                    className="w-5 h-5 text-indigo-400"
                  ></i>
                  <div>
                    <h2 className="font-bold leading-tight">Admin Portal</h2>
                    <p className="text-[10px] text-slate-400 font-medium tracking-wide">
                      PUZZLE DATA PREVIEW
                    </p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              </div>
              <div className="flex p-2 bg-slate-50 border-b border-slate-200">
                {tabs.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${
                      activeTab === tab.id
                        ? 'bg-white text-indigo-700 shadow border border-slate-100'
                        : 'text-slate-500'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
              <div className="p-6 overflow-y-auto hide-scrollbar flex-1 bg-white">
                {activeData && (
                  <div className="mb-5 flex justify-between items-end border-b border-slate-100 pb-4">
                    <div>
                      <div className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-1">
                        {activeData.gameType.replace('_', ' ')}
                      </div>
                      <div className="text-lg font-bold text-slate-800 leading-none">
                        {activeData.dateStr}
                      </div>
                    </div>
                    <div className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">
                      Day #{activeData.dayIndex + 1}
                    </div>
                  </div>
                )}
                {renderSolution()}
              </div>
            </div>
          </div>
        );
      };

      const DEFAULT_STATS = {
        played: 0,
        wins: 0,
        currentStreak: 0,
        maxStreak: 0,
      };

      function App() {
        const params = getDayParams();
        const [gameState, setGameState] = useState({
          history: [],
          currentGuess: null,
          status: 'playing',
        });
        const [allStats, setAllStats] = useState({});

        const [showHelp, setShowHelp] = useState(false);
        const [showStats, setShowStats] = useState(false);
        const [showAdminAuth, setShowAdminAuth] = useState(false);
        const [adminPwd, setAdminPwd] = useState('');
        const [showAdmin, setShowAdmin] = useState(false);
        const [timeToMidnight, setTimeToMidnight] = useState('00:00:00');
        const [toastMsg, setToastMsg] = useState('');
        const [shareImage, setShareImage] = useState(null);
        const [isCapturing, setIsCapturing] = useState(false);

        useEffect(() => {
          const savedStats =
            JSON.parse(localStorage.getItem('corpQuestStats_v3')) || {};
          setAllStats(savedStats);

          const savedStateRaw = localStorage.getItem('corpQuestState_v3');
          let loadedState = false;

          if (savedStateRaw) {
            try {
              const parsed = JSON.parse(savedStateRaw);
              if (
                parsed.date === params.todayStr &&
                parsed.gameType === params.gameType
              ) {
                setGameState(parsed.gameState);
                loadedState = true;
              }
            } catch (e) {
              console.error('Corrupt local storage data, starting fresh.');
            }
          }

          if (!loadedState) {
            let initialGuess = '';
            if (
              params.gameType === 'TALENT_GRID' ||
              params.gameType === 'ORG_CHART'
            ) {
              initialGuess = {};
              params.puzzleData.roles.forEach((r) => (initialGuess[r] = ''));
            } else if (
              params.gameType === 'PROCESS_FLOW' ||
              params.gameType === 'ACRONYM_BUILDER' ||
              params.gameType === 'EMAIL_CRAFT'
            ) {
              initialGuess = [];
            } else if (
              params.gameType === 'POLICY_SORTER' ||
              params.gameType === 'BENEFIT_SORTER'
            ) {
              initialGuess = { 0: [], 1: [] };
            }
            setGameState({
              history: [],
              currentGuess: initialGuess,
              status: 'playing',
            });
            if (!savedStats[params.gameType]) setShowHelp(true);
          }

          if (window.lucide) setTimeout(() => window.lucide.createIcons(), 100);
        }, []);

        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        });

        useEffect(() => {
          if (gameState.history.length > 0 || gameState.status !== 'playing') {
            localStorage.setItem(
              'corpQuestState_v3',
              JSON.stringify({
                date: params.todayStr,
                gameType: params.gameType,
                gameState,
              })
            );
          }
        }, [gameState]);

        useEffect(() => {
          const timer = setInterval(() => {
            const now = new Date();
            const midnight = new Date(
              now.getFullYear(),
              now.getMonth(),
              now.getDate() + 1,
              0,
              0,
              0
            );
            const diff = midnight - now;
            const h = Math.floor(
              (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
            );
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            setTimeToMidnight(
              `${String(h).padStart(2, '0')}:${String(m).padStart(
                2,
                '0'
              )}:${String(s).padStart(2, '0')}`
            );
            if (h === 0 && m === 0 && s === 0) window.location.reload();
          }, 1000);
          return () => clearInterval(timer);
        }, []);

        const triggerToast = (msg) => {
          setToastMsg(msg);
          setTimeout(() => setToastMsg(''), 3000);
        };

        const handleGameOver = (status, attempts) => {
          const currentStats = allStats[params.gameType] || {
            ...DEFAULT_STATS,
          };
          const newStats = { ...currentStats, played: currentStats.played + 1 };
          if (status === 'won') {
            newStats.wins += 1;
            newStats.currentStreak += 1;
            newStats.maxStreak = Math.max(
              newStats.maxStreak,
              newStats.currentStreak
            );
          } else newStats.currentStreak = 0;

          const updatedAllStats = { ...allStats, [params.gameType]: newStats };
          setAllStats(updatedAllStats);
          localStorage.setItem(
            'corpQuestStats_v3',
            JSON.stringify(updatedAllStats)
          );
          setTimeout(() => setShowStats(true), 1500);
        };

        const submitAdminPwd = () => {
          if (adminPwd === ADMIN_PASSWORD) {
            setShowAdminAuth(false);
            setAdminPwd('');
            setShowAdmin(true);
          } else {
            triggerToast('Password Salah!');
          }
        };

        const handleShare = async () => {
          setIsCapturing(true);
          try {
            if (!window.html2canvas) {
              triggerToast('Sistem error: screenshot library belum termuat.');
              setIsCapturing(false);
              return;
            }

            const element = document.getElementById('capture-node');
            // Menghilangkan border radius sesaat agar hasil tangkapan kotak bersih
            const originalRadius = element.style.borderRadius;
            element.style.borderRadius = '0px';

            const canvas = await window.html2canvas(element, {
              scale: 2, // Resolusi tinggi (Retina)
              backgroundColor: '#ffffff',
              useCORS: true,
            });

            element.style.borderRadius = originalRadius; // Kembalikan style

            const dataUrl = canvas.toDataURL('image/png');
            setShareImage(dataUrl);
          } catch (err) {
            console.error(err);
            triggerToast('Gagal mengambil screenshot.');
          }
          setIsCapturing(false);
        };

        const downloadImage = () => {
          if (!shareImage) return;
          const a = document.createElement('a');
          a.href = shareImage;
          a.download = `CorpQuest-${params.todayStr}.png`;
          a.click();
        };

        const shareToApps = async () => {
          if (!shareImage) return;
          try {
            // Convert DataURL ke Blob/File agar bisa dikirim ke OS Native
            const res = await fetch(shareImage);
            const blob = await res.blob();
            const file = new File([blob], `CorpQuest-${params.todayStr}.png`, {
              type: 'image/png',
            });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'My CorpQuest Result',
                files: [file],
              });
            } else {
              triggerToast(
                'Browser ini tidak mendukung direct share. Silakan klik Save Image.'
              );
            }
          } catch (err) {
            console.error(err);
            triggerToast('Batal membagikan gambar.');
          }
        };

        return (
          <div className="max-w-md mx-auto min-h-screen flex flex-col relative bg-slate-50 shadow-2xl overflow-hidden">
            {gameState.status === 'won' && <Confetti />}
            <Toast message={toastMsg} isVisible={!!toastMsg} />

            <header className="flex justify-between items-center p-4 border-b border-slate-200 bg-white sticky top-0 z-10">
              <div className="flex-1 flex gap-1">
                <button
                  onClick={() => setShowAdminAuth(true)}
                  className="p-2 text-slate-400 hover:text-indigo-600 transition rounded-full hover:bg-indigo-50"
                >
                  <i data-lucide="shield" className="w-5 h-5"></i>
                </button>
                <button
                  onClick={() => setShowHelp(true)}
                  className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100"
                >
                  <i data-lucide="help-circle" className="w-5 h-5"></i>
                </button>
              </div>
              <div className="text-center shrink-0">
                <h1 className="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">
                  CorpQuest
                </h1>
                <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">
                  {params.gameType.replace('_', ' ')}
                </p>
              </div>
              <div className="flex-1 flex justify-end">
                <button
                  onClick={() => setShowStats(true)}
                  className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100 relative"
                >
                  <i data-lucide="bar-chart-2" className="w-5 h-5"></i>
                  {gameState.status !== 'playing' && (
                    <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full"></span>
                  )}
                </button>
              </div>
            </header>

            <main className="flex-1 p-4 flex flex-col overflow-y-auto hide-scrollbar relative z-0">
              {(params.gameType === 'TALENT_GRID' ||
                params.gameType === 'ORG_CHART') && (
                <GridGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
              {params.gameType === 'JARGON_BUSTER' && (
                <WordleGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
              {params.gameType === 'PROCESS_FLOW' && (
                <SequenceGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
              {(params.gameType === 'ACRONYM_BUILDER' ||
                params.gameType === 'EMAIL_CRAFT') && (
                <WordBuilderGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
              {(params.gameType === 'POLICY_SORTER' ||
                params.gameType === 'BENEFIT_SORTER') && (
                <CategorizerGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
              {params.gameType === 'MEETING_MINDER' && (
                <TimelineGame
                  puzzle={params.puzzleData}
                  maxAttempts={params.maxAttempts}
                  gameState={gameState}
                  setGameState={setGameState}
                  onGameOver={handleGameOver}
                />
              )}
            </main>

            <Modals
              showHelp={showHelp}
              setShowHelp={setShowHelp}
              showStats={showStats}
              setShowStats={setShowStats}
              stats={allStats[params.gameType] || DEFAULT_STATS}
              timeToMidnight={timeToMidnight}
              handleShare={handleShare}
              gameType={params.gameType}
              gameStatus={gameState.status}
              puzzle={params.puzzleData}
              shareImage={shareImage}
              setShareImage={setShareImage}
              isCapturing={isCapturing}
              downloadImage={downloadImage}
              shareToApps={shareToApps}
            />

            <AdminPanel
              isVisible={showAdmin}
              onClose={() => setShowAdmin(false)}
              currentDayIndex={params.dayIndex}
            />

            {showAdminAuth && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-pop text-center">
                  <h3 className="font-bold text-lg mb-2">Admin Access</h3>
                  <p className="text-sm text-slate-500 mb-4">
                    Masukkan password untuk melihat jawaban (Portal Admin).
                  </p>
                  <input
                    type="password"
                    value={adminPwd}
                    onChange={(e) => setAdminPwd(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && submitAdminPwd()}
                    className="w-full p-3 border border-slate-200 rounded-xl mb-4 text-center tracking-widest focus:outline-indigo-500"
                    placeholder="••••••••"
                  />
                  <div className="flex gap-2">
                    <button
                      onClick={() => {
                        setShowAdminAuth(false);
                        setAdminPwd('');
                      }}
                      className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200"
                    >
                      Batal
                    </button>
                    <button
                      onClick={submitAdminPwd}
                      className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700"
                    >
                      Masuk
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
