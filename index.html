                                                        {leaderboard.length === 0 && <p className="text-center text-sm text-slate-400 py-4">No scores yet today.</p>}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            )
        };

        const AdminPanel = ({ isVisible, onClose, currentDayIndex, onTestDrive }) => {
            const [activeTab, setActiveTab] = useState(0); 
            
            if (!isVisible) return null;

            const tabs = [
                { id: -1, label: 'Yesterday' }, 
                { id: 0, label: 'Today' }, 
                { id: 1, label: 'Tomorrow' },
                { id: 'test', label: 'Test Drive' }
            ];

            const renderTestDrive = () => (
                <div className="animate-fade-in">
                    <p className="text-sm text-slate-600 mb-4 text-center">Launch a randomly generated sandbox instance of any game mode below. Scores will not be saved.</p>
                    <div className="grid grid-cols-1 gap-3">
                        {GAME_TYPES.map(type => (
                            <button 
                                key={type} 
                                onClick={() => onTestDrive(type)} 
                                className="flex items-center justify-between p-4 bg-white border border-slate-200 rounded-xl hover:border-indigo-400 hover:shadow-md transition-all active:scale-95 group"
                            >
                                <span className="font-bold text-slate-800 group-hover:text-indigo-600">{type.replace('_', ' ')}</span>
                                <Icon name="play" className="w-5 h-5 text-slate-300 group-hover:text-indigo-500" />
                            </button>
                        ))}
                    </div>
                </div>
            );

            try {
                let activePuzzles = null;
                let activeTypesForDay = [];
                let targetDateStr = '';

                if (activeTab !== 'test') {
                    const targetDayIndex = currentDayIndex + activeTab;
                    activePuzzles = getAllPuzzlesForDay(targetDayIndex);
                    
                    const rng = seededRNG(targetDayIndex + 5000);
                    activeTypesForDay = shuffleArray([...GAME_TYPES], rng).slice(0, 3);
                    
                    const targetDate = new Date(EPOCH_DATE);
                    targetDate.setDate(targetDate.getDate() + targetDayIndex);
                    targetDateStr = targetDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                }

                const renderSolution = () => {
                    if (activeTab === 'test') return renderTestDrive();
                    if (!activePuzzles) return <div className="p-8 text-center text-slate-500">No puzzle scheduled.</div>;
                    
                    return (
                        <div className="space-y-4">
                            {GAME_TYPES.map(gameType => {
                                const puzzleData = activePuzzles[gameType];
                                const isActive = activeTypesForDay.includes(gameType);
                                
                                let content = null;
                                if (gameType === 'JARGON_BUSTER') content = (<div className="text-center p-3"><p className="text-xs italic mb-2">"{puzzleData.clue}"</p><p className="text-xl font-bold tracking-[0.2em] text-emerald-600">{puzzleData.word}</p></div>);
                                else if (gameType === 'PROCESS_FLOW') content = (
                                    <div className="space-y-1 mt-2">
                                        {puzzleData.solution?.map((stepId, idx) => (
                                            <div key={stepId} className="flex gap-2 items-center bg-emerald-50 p-2 rounded border border-emerald-100"><span className="w-5 h-5 rounded bg-emerald-200 text-emerald-800 flex items-center justify-center text-[10px] font-bold">{idx + 1}</span><span className="text-[10px] font-semibold text-emerald-900">{puzzleData.steps.find(s => s.id === stepId)?.text}</span></div>
                                        ))}
                                    </div>
                                );
                                else if (gameType === 'SYNERGY_SQUARE') content = (
                                    <div className="flex flex-col gap-1 mt-2">
                                        {puzzleData.categories?.map((cat, i) => (
                                            <div key={i} className="p-2 bg-emerald-50 border border-emerald-100 rounded text-center">
                                                <p className="text-[10px] font-bold text-emerald-700 uppercase mb-1">{cat.title}</p>
                                                <p className="text-[10px] font-medium text-emerald-900">{cat.items.join(', ')}</p>
                                            </div>
                                        ))}
                                    </div>
                                );
                                else if (gameType === 'MINI_CROSSWORD') content = (
                                    <div className="p-2 bg-emerald-50 rounded border border-emerald-200 text-center mt-2">
                                        <p className="text-[10px] text-emerald-600 font-bold uppercase mb-1">Completed Grid String</p>
                                        <p className="text-xs font-mono font-bold tracking-widest text-emerald-900 break-all">{puzzleData.target}</p>
                                    </div>
                                );
                                else if (gameType === 'WORDFLOWER') content = (
                                    <div className="p-2 bg-emerald-50 rounded border border-emerald-200 text-center mt-2">
                                        <p className="text-[10px] text-emerald-600 font-bold uppercase mb-1">Pangram</p>
                                        <p className="text-sm font-black tracking-widest text-emerald-900 mb-2">{puzzleData.pangram}</p>
                                        <div className="flex flex-wrap gap-1 justify-center">
                                            {puzzleData.validWords.map(w => <span key={w} className="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded text-[9px] font-bold">{w}</span>)}
                                        </div>
                                    </div>
                                );
                                
                                return (
                                    <div key={gameType} className={`p-3 rounded-xl border-2 ${isActive ? 'border-indigo-200 bg-white shadow-sm' : 'border-slate-100 bg-slate-50 opacity-60'}`}>
                                        <div className="flex justify-between items-center mb-1">
                                            <h4 className="font-bold text-slate-800 text-xs">{gameType.replace('_', ' ')}</h4>
                                            {isActive ? <span className="text-[8px] font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded uppercase">Active</span> : <span className="text-[8px] font-bold bg-slate-200 text-slate-500 px-2 py-0.5 rounded uppercase">Locked</span>}
                                        </div>
                                        {content}
                                    </div>
                                );
                            })}
                        </div>
                    );
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl relative flex flex-col max-h-[85vh] overflow-hidden">
                            <div className="bg-slate-900 p-5 flex justify-between items-center text-white shrink-0">
                                <div className="flex items-center gap-3">
                                    <Icon name="shield" className="w-5 h-5 text-indigo-400" />
                                    <div><h2 className="font-bold leading-tight">Admin Portal</h2><p className="text-[10px] text-slate-400 font-medium tracking-wide">PUZZLE DATA & TOOLS</p></div>
                                </div>
                                <button onClick={onClose} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full"><Icon name="x" className="w-4 h-4" /></button>
                            </div>
                            <div className="flex p-2 bg-slate-50 border-b border-slate-200 shrink-0 overflow-x-auto hide-scrollbar">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 min-w-[80px] py-2.5 px-2 text-xs font-bold rounded-xl transition-all whitespace-nowrap ${activeTab === tab.id ? 'bg-white text-indigo-700 shadow border border-slate-100' : 'text-slate-500 hover:bg-slate-100'}`}>{tab.label}</button>
                                ))}
                            </div>
                            <div className="p-6 overflow-y-auto hide-scrollbar flex-1 bg-slate-50">
                                {activeTab !== 'test' && (
                                    <div className="mb-4 flex justify-between items-end border-b border-slate-200 pb-3">
                                        <div>
                                            <div className="text-sm font-bold text-slate-800 leading-none">{targetDateStr}</div>
                                        </div>
                                        <div className="text-[10px] font-bold text-slate-500 bg-slate-200 px-2 py-1 rounded-md">Day #{currentDayIndex + activeTab + 1}</div>
                                    </div>
                                )}
                                {renderSolution()}
                            </div>
                        </div>
                    </div>
                );
            } catch (err) {
                console.error("Admin Render Error:", err);
                return (
                    <div className="fixed inset-0 bg-slate-900/80 z-[60] flex items-center justify-center p-4">
                        <div className="bg-white p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
                            <Icon name="alert-triangle" className="w-12 h-12 text-rose-500 mx-auto mb-3" />
                            <h2 className="text-xl font-bold text-slate-900 mb-2">Admin Data Error</h2>
                            <p className="text-slate-500 text-sm mb-6">Failed to load the puzzle data. Please try again.</p>
                            <button onClick={onClose} className="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold">Close Admin Panel</button>
                        </div>
                    </div>
                );
            }
        };

        const Dashboard = ({ dailyStates, activeGameTypes, onSelectGame, globalStats }) => {
            const gameInfo = {
                'MINI_CROSSWORD': { title: "Corporate Crossword", desc: "4x4 daily business grid", icon: "bar-chart-2" },
                'WORDFLOWER': { title: "Wordflower", desc: "Find the 7-letter corporate pangram", icon: "star" },
                'SYNERGY_SQUARE': { title: "Synergy Square", desc: "Group 4 related business concepts", icon: "help-circle" },
                'JARGON_BUSTER': { title: "Jargon Buster", desc: "Guess the 5-letter office buzzword", icon: "lightbulb" },
                'PROCESS_FLOW': { title: "Process Flow", desc: "Sequence standard operating procedures", icon: "play" }
            };

            const completedCount = activeGameTypes.filter(id => dailyStates[id]?.status === 'won').length;

            return (
                <div className="flex flex-col h-full animate-fade-in pb-8">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 flex items-center justify-between">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Today's Hub</h2>
                            <p className="text-sm text-slate-500 mt-1">{new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</p>
                        </div>
                        <div className="flex gap-4">
                            <div className="text-center">
                                <div className="text-2xl font-black text-indigo-600">{completedCount}<span className="text-slate-300 text-lg">/3</span></div>
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Solved</div>
                            </div>
                            <div className="w-px bg-slate-200"></div>
                            <div className="text-center">
                                <div className="text-2xl font-black text-amber-500 flex items-center justify-center gap-0.5"><span className="text-lg">🔥</span>{globalStats.currentStreak}</div>
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Streak</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-3">
                        {GAME_TYPES.map(gameId => {
                            const info = gameInfo[gameId];
                            const isActive = activeGameTypes.includes(gameId);
                            const state = dailyStates[gameId];
                            const status = state?.status || 'playing';
                            const isPlayed = state?.history?.length > 0;
                            
                            if (!isActive) {
                                return (
                                    <div key={gameId} className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 flex items-center gap-4 opacity-60 grayscale">
                                        <div className="w-12 h-12 rounded-xl bg-slate-200 text-slate-400 flex items-center justify-center shrink-0">
                                            <Icon name="lock" className="w-5 h-5" />
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="font-bold text-slate-700">{info.title}</h3>
                                            <p className="text-xs text-slate-500 font-medium">Locked for today</p>
                                        </div>
                                    </div>
                                )
                            }

                            return (
                                <div key={gameId} onClick={() => onSelectGame(gameId)} className={`bg-white p-4 rounded-2xl border-2 flex items-center gap-4 cursor-pointer transition-all active:scale-95 shadow-sm hover:shadow-md ${status === 'won' ? 'border-emerald-400 bg-emerald-50/30' : status === 'lost' ? 'border-rose-300 bg-rose-50/30' : 'border-slate-200 hover:border-indigo-400'}`}>
                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${status === 'won' ? 'bg-emerald-100 text-emerald-600' : status === 'lost' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-50 text-indigo-600'}`}>
                                        <Icon name={status === 'won' ? "check-circle-2" : status === 'lost' ? "x" : info.icon} className="w-6 h-6" />
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-slate-900">{info.title}</h3>
                                        <p className="text-xs text-slate-500 font-medium">{info.desc}</p>
                                    </div>
                                    <div className="shrink-0 pl-2">
                                        {status === 'won' ? (
                                            <span className="text-xs font-bold text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full">Solved</span>
                                        ) : status === 'lost' ? (
                                            <span className="text-xs font-bold text-rose-600 bg-rose-100 px-2.5 py-1 rounded-full">Failed</span>
                                        ) : isPlayed ? (
                                            <span className="text-xs font-bold text-amber-600 bg-amber-100 px-2.5 py-1 rounded-full">In Progress</span>
                                        ) : (
                                            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Play</span>
                                        )}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const DEFAULT_STATS = { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, lastScore: 0, scoreHistory: [] };
        const DEFAULT_GLOBAL_STATS = { currentStreak: 0, maxStreak: 0, lastPlayedDate: null };

        function App() {
            const [dayParams] = useState(() => getDayParams()); 
            
            const [dailyStates, setDailyStates] = useState(() => {
                const initial = {};
                GAME_TYPES.forEach(type => {
                    initial[type] = { 
                        history: [], 
                        currentGuess: type === 'PROCESS_FLOW' ? [] : 
                                      type === 'SYNERGY_SQUARE' ? { board: shuffleArray(dayParams.puzzles[type].categories.flatMap(c => c.items), seededRNG(dayParams.rngSeed)), selected: [], solved: [] } : 
                                      type === 'MINI_CROSSWORD' ? Array(16).fill('') : '', 
                        status: 'playing' 
                    };
                });
                
                const savedRaw = localStorage.getItem('corpQuestDaily_v9');
                if (savedRaw) {
                    try {
                        const parsed = JSON.parse(savedRaw);
                        if (parsed.date === dayParams.todayStr) {
                            const mergedStates = { ...initial };
                            Object.keys(parsed.states).forEach(key => {
                                if (parsed.states[key]) {
                                    mergedStates[key] = parsed.states[key];
                                }
                            });
                            return mergedStates;
                        }
                    } catch(e) { console.error("Corrupted state reset."); }
                }
                return initial;
            });

            const [activeGame, setActiveGame] = useState(null); 
            const [testDriveState, setTestDriveState] = useState(null); 

            const [allStats, setAllStats] = useState({});
            const [globalStats, setGlobalStats] = useState(DEFAULT_GLOBAL_STATS);
            
            const [currentUser, setCurrentUser] = useState(null);
            const [gameStartTime, setGameStartTime] = useState(Date.now());
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfileMenu, setShowProfileMenu] = useState(false);

            const [showHelp, setShowHelp] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [showAdminAuth, setShowAdminAuth] = useState(false);
            const [adminPwd, setAdminPwd] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [timeToMidnight, setTimeToMidnight] = useState('00:00:00');
            
            const [toastObj, setToastObj] = useState({ msg: '', isError: false });
            const [shareImage, setShareImage] = useState(null);
            const [isCapturing, setIsCapturing] = useState(false);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        setCurrentUser({ uid: user.uid, name: user.displayName || user.email.split('@')[0], email: user.email });
                    } else {
                        setCurrentUser(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const savedStats = JSON.parse(localStorage.getItem('corpQuestStats_v9')) || {};
                setAllStats(savedStats);
                
                const savedGlobal = JSON.parse(localStorage.getItem('corpQuestGlobal_v9')) || DEFAULT_GLOBAL_STATS;
                setGlobalStats(savedGlobal);
            }, []);

            useEffect(() => {
                localStorage.setItem('corpQuestDaily_v9', JSON.stringify({
                    date: dayParams.todayStr, states: dailyStates
                }));
            }, [dailyStates, dayParams.todayStr]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
                    const diff = midnight - now;
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    setTimeToMidnight(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`);
                    if (h === 0 && m === 0 && s === 0 && activeGame !== 'TEST_DRIVE') window.location.reload();
                }, 1000);
                return () => clearInterval(timer);
            }, [activeGame]);

            const triggerToast = (msg, isError = false) => { setToastObj({ msg, isError }); setTimeout(() => setToastObj({ msg: '', isError: false }), 4000); };

            const handleGameOver = (status, attempts) => {
                if (activeGame === 'TEST_DRIVE') {
                    setTimeout(() => setShowStats(true), 1500);
                    return; 
                }

                const gameType = activeGame;
                const maxAtt = getGameMaxAttempts(gameType);
                const timeTakenSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
                const score = calculateScore(status === 'won', attempts, maxAtt, timeTakenSeconds);

                const currentStats = allStats[gameType] || { ...DEFAULT_STATS, scoreHistory: [] };
                
                const newStats = { ...currentStats, played: currentStats.played + 1, lastScore: score };
                newStats.scoreHistory = [...(currentStats.scoreHistory || []), score].slice(-5); 

                if (status === 'won') {
                    newStats.wins += 1;
                    newStats.currentStreak += 1;
                    newStats.maxStreak = Math.max(newStats.maxStreak, newStats.currentStreak);
                } else newStats.currentStreak = 0;

                const updatedAllStats = { ...allStats, [gameType]: newStats };
                setAllStats(updatedAllStats);
                localStorage.setItem('corpQuestStats_v9', JSON.stringify(updatedAllStats));
                
                let newGlobalStats = { ...globalStats };
                if (newGlobalStats.lastPlayedDate !== dayParams.todayStr) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
                    
                    if (newGlobalStats.lastPlayedDate === yesterdayStr) {
                        newGlobalStats.currentStreak += 1;
                    } else {
                        newGlobalStats.currentStreak = 1; 
                    }
                    newGlobalStats.lastPlayedDate = dayParams.todayStr;
                    newGlobalStats.maxStreak = Math.max(newGlobalStats.maxStreak, newGlobalStats.currentStreak);
                    
                    setGlobalStats(newGlobalStats);
                    localStorage.setItem('corpQuestGlobal_v9', JSON.stringify(newGlobalStats));
                }

                if (auth.currentUser) {
                    CloudDB.saveScore(currentUser || { uid: auth.currentUser.uid, name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0] }, gameType, dayParams.dayIndex, score, timeTakenSeconds);
                }
                setTimeout(() => setShowStats(true), 1500);
            };

            const submitAdminPwd = () => {
                if (adminPwd.trim() === ADMIN_PASSWORD) {
                    setShowAdminAuth(false); setAdminPwd(''); setShowAdmin(true);
                } else { triggerToast("Incorrect Password!", true); }
            };

            const handleTestDrive = (type) => {
                const fakeSeed = Math.floor(Math.random() * 1000000);
                const puzzleData = window.generatePuzzleData(type, fakeSeed);
                const maxAttempts = getGameMaxAttempts(type);

                let initialGuess = '';
                if (type === 'PROCESS_FLOW') initialGuess = [];
                else if (type === 'SYNERGY_SQUARE') {
                    const rng = seededRNG(fakeSeed);
                    const allItems = puzzleData.categories.flatMap(c => c.items);
                    initialGuess = { board: shuffleArray(allItems, rng), selected: [], solved: [] };
                } else if (type === 'MINI_CROSSWORD') initialGuess = Array(16).fill('');

                setTestDriveState({
                    gameType: type,
                    puzzle: puzzleData,
                    maxAttempts,
                    gameState: { history: [], currentGuess: initialGuess, status: 'playing' }
                });
                
                setActiveGame('TEST_DRIVE');
                setGameStartTime(Date.now());
                setShowAdmin(false);
                setShowHelp(true);
                triggerToast(`Test Drive: ${type.replace('_', ' ')}`, false);
            };

            const handleLogin = async (user) => {
                triggerToast(`Welcome back, ${user.name}!`);
                if (activeGame && activeGame !== 'TEST_DRIVE' && dailyStates[activeGame]?.status === 'won') {
                    const stats = allStats[activeGame];
                    if (stats && stats.lastScore > 0) {
                        await CloudDB.saveScore(user, activeGame, dayParams.dayIndex, stats.lastScore, 60); 
                    }
                }
            };

            const handleLogout = () => {
                auth.signOut().then(() => { setShowProfileMenu(false); triggerToast("Logged out successfully."); });
            };

            const handleShare = () => {
                setIsCapturing(true);
                setTimeout(async () => {
                    try {
                        if (!window.html2canvas) { triggerToast("System error: screenshot library not loaded.", true); setIsCapturing(false); return; }
                        const element = document.getElementById('capture-node');
                        if (!element) throw new Error("Capture node not found");
                        const originalRadius = element.style.borderRadius;
                        element.style.borderRadius = '0px';
                        const canvas = await window.html2canvas(element, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
                        element.style.borderRadius = originalRadius; 
                        setShareImage(canvas.toDataURL('image/png'));
                    } catch (err) { console.error(err); triggerToast("Failed to capture screenshot.", true); }
                    setIsCapturing(false);
                }, 150);
            };

            const downloadImage = () => {
                if (!shareImage) return;
                const a = document.createElement('a'); a.href = shareImage; a.download = `CorpQuest-${dayParams.todayStr}.png`; a.click();
            };

            const shareToApps = async () => {
                if (!shareImage) return;
                try {
                    const res = await fetch(shareImage);
                    const blob = await res.blob();
                    const file = new File([blob], `CorpQuest-${dayParams.todayStr}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'My CorpQuest Result', files: [file] });
                    } else { triggerToast("Direct sharing not supported on this browser. Please click Save Image.", true); }
                } catch (err) { console.error(err); triggerToast("Share cancelled.", true); }
            };

            const handleSelectGame = (id) => {
                setActiveGame(id);
                setGameStartTime(Date.now());
                if (dailyStates[id]?.status !== 'playing') {
                    setTimeout(() => setShowStats(true), 100);
                } else if (!allStats[id]) {
                    setShowHelp(true);
                }
            };

            const currentGameType = activeGame === 'TEST_DRIVE' ? testDriveState.gameType : activeGame;
            const currentPuzzle = activeGame === 'TEST_DRIVE' ? testDriveState.puzzle : (activeGame ? dayParams.puzzles[activeGame] : null);
            const currentMaxAttempts = activeGame === 'TEST_DRIVE' ? testDriveState.maxAttempts : (activeGame ? getGameMaxAttempts(activeGame) : 5);
            
            const fallbackState = { history: [], currentGuess: '', status: 'playing' };
            const currentGameState = activeGame === 'TEST_DRIVE' ? testDriveState.gameState : (dailyStates[activeGame] || fallbackState);
            
            const updateActiveGameState = (newStateFn) => {
                if (!activeGame) return;
                if (activeGame === 'TEST_DRIVE') {
                    setTestDriveState(prev => ({ ...prev, gameState: typeof newStateFn === 'function' ? newStateFn(prev.gameState) : newStateFn }));
                } else {
                    setDailyStates(prev => {
                        const oldState = prev[activeGame] || fallbackState;
                        const nextState = typeof newStateFn === 'function' ? newStateFn(oldState) : newStateFn;
                        return { ...prev, [activeGame]: nextState };
                    });
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col relative bg-slate-50 shadow-2xl overflow-hidden">
                    {activeGame && currentGameState?.status === 'won' && <Confetti />}
                    <Toast message={toastObj.msg} isVisible={!!toastObj.msg} isError={toastObj.isError} />
                    
                    <header className="flex justify-between items-center p-4 border-b border-slate-200 bg-white sticky top-0 z-10 glass-panel">
                        <div className="flex-1 flex gap-1">
                            {activeGame ? (
                                <button onClick={() => {setActiveGame(null); setTestDriveState(null);}} className="flex items-center gap-1 text-slate-500 font-bold text-sm hover:text-indigo-600 transition p-2 hover:bg-slate-100 rounded-lg">
                                    <Icon name="chevron-left" className="w-5 h-5" /> Back
                                </button>
                            ) : (
                                <button onClick={() => setShowAdminAuth(true)} className="p-2 text-slate-400 hover:text-indigo-600 transition rounded-full hover:bg-indigo-50"><Icon name="shield" className="w-5 h-5" /></button>
                            )}
                        </div>
                        <div className="text-center shrink-0">
                            <h1 className="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">CorpQuest</h1>
                            <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">{activeGame === 'TEST_DRIVE' ? `TEST: ${currentGameType.replace('_', ' ')}` : (activeGame ? activeGame.replace('_', ' ') : 'DAILY HUB')}</p>
                        </div>
                        <div className="flex-1 flex justify-end gap-1 relative">
                            {activeGame && (
                                <button onClick={() => setShowHelp(true)} className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100">
                                    <Icon name="help-circle" className="w-5 h-5" />
                                </button>
                            )}
                            <button onClick={() => activeGame ? setShowStats(true) : (currentUser ? setShowProfileMenu(!showProfileMenu) : setShowAuthModal(true))} className="p-2 text-slate-400 hover:text-slate-800 transition rounded-full hover:bg-slate-100 relative">
                                {activeGame ? <Icon name="bar-chart-2" className="w-5 h-5" /> : <Icon name="user" className={`w-5 h-5 ${currentUser ? 'text-indigo-600' : ''}`} />}
                                {activeGame && currentGameState?.status !== 'playing' && <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full"></span>}
                                {!activeGame && !currentUser && <span className="absolute top-2 right-2 w-2 h-2 bg-amber-400 rounded-full border border-white"></span>}
                            </button>
                            
                            {showProfileMenu && currentUser && !activeGame && (
                                <div className="absolute top-full right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 p-2 animate-pop z-50">
                                    <div className="px-3 py-2 border-b border-slate-100 mb-2">
                                        <p className="text-xs font-bold text-slate-800 truncate">{currentUser.name}</p>
                                        <p className="text-[10px] text-emerald-500 font-semibold">Global Sync Active</p>
                                    </div>
                                    <button onClick={handleLogout} className="w-full text-left px-3 py-2 text-sm text-rose-600 font-semibold hover:bg-rose-50 rounded-lg flex items-center gap-2">
                                        <Icon name="log-out" className="w-4 h-4" /> Sign Out
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 p-4 flex flex-col overflow-y-auto hide-scrollbar relative z-0">
                        {!activeGame && <Dashboard dailyStates={dailyStates} activeGameTypes={dayParams.activeGameTypes} onSelectGame={handleSelectGame} globalStats={globalStats} />}
                        
                        {activeGame && currentGameType === 'JARGON_BUSTER' && <WordleGame puzzle={currentPuzzle} maxAttempts={currentMaxAttempts} gameState={currentGameState} setGameState={updateActiveGameState} onGameOver={handleGameOver} />}
                        {activeGame && currentGameType === 'PROCESS_FLOW' && <SequenceGame puzzle={currentPuzzle} maxAttempts={currentMaxAttempts} gameState={currentGameState} setGameState={updateActiveGameState} onGameOver={handleGameOver} />}
                        {activeGame && currentGameType === 'SYNERGY_SQUARE' && <SynergyGame puzzle={currentPuzzle} maxAttempts={currentMaxAttempts} gameState={currentGameState} setGameState={updateActiveGameState} onGameOver={handleGameOver} triggerToast={triggerToast} />}
                        {activeGame && currentGameType === 'MINI_CROSSWORD' && <CrosswordGame puzzle={currentPuzzle} maxAttempts={currentMaxAttempts} gameState={currentGameState} setGameState={updateActiveGameState} onGameOver={handleGameOver} />}
                        {activeGame && currentGameType === 'WORDFLOWER' && <WordflowerGame puzzle={currentPuzzle} maxAttempts={currentMaxAttempts} gameState={currentGameState} setGameState={updateActiveGameState} onGameOver={handleGameOver} triggerToast={triggerToast} />}
                    </main>

                    <AuthModal isVisible={showAuthModal} onClose={() => setShowAuthModal(false)} onLogin={handleLogin} triggerToast={triggerToast} />

                    {activeGame && (
                        <Modals showHelp={showHelp} setShowHelp={setShowHelp} showStats={showStats} setShowStats={setShowStats} stats={activeGame === 'TEST_DRIVE' ? DEFAULT_STATS : (allStats[activeGame] || DEFAULT_STATS)} timeToMidnight={timeToMidnight} handleShare={handleShare} gameType={currentGameType} gameStatus={currentGameState?.status} puzzle={currentPuzzle} shareImage={shareImage} setShareImage={setShareImage} isCapturing={isCapturing} downloadImage={downloadImage} shareToApps={shareToApps} currentUser={currentUser} onOpenAuth={() => { setShowStats(false); setShowAuthModal(true); }} dayIndex={dayParams.dayIndex} isTestMode={activeGame === 'TEST_DRIVE'} />
                    )}
                    
                    <AdminPanel isVisible={showAdmin} onClose={() => setShowAdmin(false)} currentDayIndex={dayParams.dayIndex} onTestDrive={handleTestDrive} />

                    {showAdminAuth && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-pop text-center">
                                <h3 className="font-bold text-lg mb-2">Admin Access</h3>
                                <p className="text-sm text-slate-500 mb-4">Enter password to access the portal.</p>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitAdminPwd()} className="w-full p-3 border border-slate-200 rounded-xl mb-4 text-center tracking-widest focus:outline-indigo-500" placeholder="••••••••" />
                                <div className="flex gap-2">
                                    <button onClick={() => {setShowAdminAuth(false); setAdminPwd('');}} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200">Cancel</button>
                                    <button onClick={submitAdminPwd} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Enter</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
